note: "Persian name: ایران صفوی (fa.wikipedia article title, source wp-fa-langlinks; secondary). Kind (draft wording): shahdom. Start: 1501 (Esmāʿil proclaimed shah in Tabriz) [scholarly-consensus; bounds 1501 CE; eir-safavid-dynasty, wp-en-safavid-iran]. The Wikipedia monarch list starts Esmāʿil I's reign 11 May 1502 (Spuler); the polity is dated 1501 by Iranica and Wikipedia's Safavid article. End: 1722 (fall of Isfahan) or 1736 (deposition of ʿAbbās III) [contested; bounds 1722 CE to 1736 CE; eir-safavid-dynasty, wp-en-list-of-monarchs-of-iran]. Iranica (Matthee): \"ruled Persia from 1501 to 1722\". Safavid shahs reigned nominally under Nader until 8 March 1736 (old dataset end), and Zand-era puppets until 1773. Record label contested is the weaker of the start label (scholarly-consensus) and end label (contested); see docs/iran/README.md. Predecessors: aq-qoyunlu; timurid. Successors: hotaki; afsharid. Wikidata: Q18234383 (via wp-fa-langlinks; verify item scope before use). Further reading, not consulted this pass: chi-6."
