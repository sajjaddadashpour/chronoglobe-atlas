note: "Persian name: ایران قاجاری (fa.wikipedia article title, source wp-fa-langlinks; secondary). Kind (draft wording): shahdom; constitutional monarchy from 1906. Start: 1779 / 1786 / 1789 / 1796 (see alternatives) [contested; bounds 1779 CE to 1796 CE; eir-zand-dynasty, eir-fath-ali-shah, wp-en-list-of-monarchs-of-iran]. Āqā Moḥammad Khan: rule counted from 1779 (Iranica ZAND, r. 1779-97); accession at his new capital Tehran 21 March 1786 (Iranica FATḤ-ʿALI SHAH); 1789 in the Wikipedia list (and the old dataset); he assumed the royal title only later (coronation; year to verify). End: 1925 (Majles deposes the dynasty, 12 Dec; Reza Shah 15 Dec) [attested; bounds 1925 CE; wp-en-pahlavi-iran, eir-ahmad-shah-qajar, wp-en-list-of-monarchs-of-iran]. Record label contested is the weaker of the start label (contested) and end label (attested); see docs/iran/README.md. Predecessors: zand; afsharid. Successors: pahlavi. Wikidata: Q63158027 (via wp-fa-langlinks; verify item scope before use). Further reading, not consulted this pass: chi-7."
