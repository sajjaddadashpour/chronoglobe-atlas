note: "Korean name: 부여 (EKC). Start: 2nd century BCE (EKC; encoded 200 BCE as earliest possible) [estimate]. End: 494 CE (last ruler surrenders to Goguryeo) [attested]. EKC: the capital fell to the Murong Xianbei in 285 and Buyeo was raided by Former Yan in 346. Eastern Buyeo (Dongbuyeo) kings Geumwa and Daeso, known only from Samguk sagi, are filed under this polity as in the Wikipedia list. Record label estimate is the weaker of start (estimate) and end (attested). Successors: goguryeo. Evidence: scholarly-or-primary."
