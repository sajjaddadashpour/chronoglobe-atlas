note: "Persian name: ماد (fa.wikipedia article title, source wp-fa-langlinks; secondary). Also called: Media; Median \"empire\". Kind (draft wording): kingdom / tribal confederation (extent and statehood debated). Start: c. 700 BCE (conventional; 728 / 700 / 672 in competing chronologies) [contested; bounds 728 BCE to 672 BCE; eir-media-ii, eir-media-iii, eir-deioces]. Start depends on how Herodotus' 150-year king list is fitted to Assyrian evidence. See rulers file. End: 550 BCE (Astyages defeated by Cyrus II) [attested; bounds 550 BCE; eir-media-ii, eir-astyages, eir-cyrus-iii]. War with Cyrus 553-550 BCE, Nabonidus Chronicle and Dream Text. Record label contested is the weaker of the start label (contested) and end label (attested); see docs/iran/README.md. Successors: achaemenid. Only Cyaxares (Umakištar) and Astyages (Ištumegu) appear by name in cuneiform; Deioces and Phraortes are known from Herodotus. The Assyrian Daiukku (a Mannean governor deported in 715 BCE) is only hypothetically Deioces; the \"House of Deioces\" is a misreading. Fixed points: Kaštariti revolt c. 673/672; fall of Nineveh 612; eclipse/battle of the Halys 29 May 585; Cyrus vs Astyages 553-550. Wikidata: Q8735 (via wp-fa-langlinks; verify item scope before use). Further reading, not consulted this pass: chi-2."
