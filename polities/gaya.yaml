note: "Korean name: 가야 (EKC). A league of small states in the lower Nakdong basin, never unified (EKC). Kind 'other' = confederacy. Start: 1st century BCE (EKC; Byeonhan statelets) [estimate]. End: 562 CE (fall of Daegaya to Silla) [attested]. Earlier league led by Geumgwan Gaya (Gimhae), later league led by Daegaya (Goryeong) from the mid-5th century (EKC). Member states: geumgwan-gaya, daegaya; others (Ara, Sogaya, etc.) not modelled. Gaya chronology is contested (Garakguk-gi in Samguk yusa vs Nihon shoki 'Mimana' accounts); see docs/korea/CONTESTED.md. Evidence: scholarly-or-primary."
