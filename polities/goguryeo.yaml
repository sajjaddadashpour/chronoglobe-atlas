note: "Korean name: 고구려 (EKC). Start contested: 37 BCE (Samguk sagi, founding by Jumong) vs. the 1st century BCE or earlier (EKC period heading; a Goguryeo polity is implied by the Han county name in Xuantu). End: 668 CE (fall of Pyongyang to Silla-Tang) [attested]. Critical scholarship treats Samguk sagi reign data before King Sansang/Taejo as unreliable (EKC); those rulers are labelled contested. Successors: unified-silla, balhae (claims of continuity contested). Evidence: scholarly-or-primary."
