note: "Korean name: 고조선 (EKC article title); called 'Joseon' (조선) in early Chinese texts; the name Gojoseon is first used in Samguk yusa. Start: contested. The 2333 BCE founding by Dangun (Samguk yusa / later tradition) is legendary; the EKC article states the year has no real historical meaning, because farming and bronze reached Liaoxi/Liaodong only in the second millennium BCE. Earliest written mentions are in Shanhaijing and Guanzi (texts of uncertain date; Guanzi is mostly Warring States, 402-221 BCE, possibly resting on traditions older than the 5th century BCE). By the mid-4th century BCE at the latest Joseon is clearly attested (Su Qin's speech to Marquis Wen of Yan, r. 361-333 BCE, in Shiji / Zhanguoce). End: c. 194 BCE (Wiman's coup) if Gojoseon means only pre-Wiman Joseon, the usual political scope; 108 BCE if Wiman Joseon is included (EKC gives both scopes). This atlas keeps Wiman Joseon as a separate polity (wiman-joseon). Location of the centre is contested (Liaoning-centre theory, migration theory from Liaodong to Pyongyang, Pyongyang-centre theory; North Korea claimed Dangun's tomb near Pyongyang in 1993); see capital record gojoseon-capital-centre-of-gojoseon. Rulers before Bu and Jun are legendary or unattested. Record label contested is the weaker of the start label (contested) and end label (contested); see docs/korea/README.md. Successors: wiman-joseon. Evidence: scholarly-or-primary."
