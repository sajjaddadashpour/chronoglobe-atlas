note: "Korean name: 신라 (EKC). Start: 57 BCE in Samguk sagi (Hyeokgeose); EKC notes Saro-guk in the Gyeongju basin probably formed as a city-state before this, and critical scholarship doubts the Samguk sagi chronology before King Naemul (r. 356-402). End of this record: 668 CE, by the atlas convention of splitting Silla at the fall of Goguryeo (EKC treats Silla as one state, 57 BCE-935 CE). Successors: unified-silla. Evidence: scholarly-or-primary."
