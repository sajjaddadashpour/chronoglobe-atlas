note: "Role: highland royal centre (royal title \"king of Anshan and Susa\"). Dates as given: 2400–539 BCE. Start 2400 BCE; end 539 BCE. Highland seat; Hutelutuš-Inšušinak took refuge there c. 1120s BCE. Anshan was ruled by the early Achaemenids by the 6th century. Evidence: scholarly-or-primary."
