note: "Capital in the Han River basin from the founding (Samguk sagi 18 BCE, contested) to the fall of Hanseong in 475 (EKC 백제 periodization). EKC 위례성: Hanam Wirye-seong is most often identified with Pungnap-dong earthen fort (Seoul); the name changed to Hanseong from the mid/late 4th century, linked to the 371 move to Hansan (a double capital of the northern fort, Pungnap, and southern fort, Mongchon); not encoded separately. Evidence: scholarly-or-primary."
