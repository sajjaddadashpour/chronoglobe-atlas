note: "Role: capital of Cyrus II, or dynastic/ceremonial site. Dates as given: 550/40–330 BCE. Start 550 BCE to 540 BCE; end 330 BCE. Gopnik (Iranica PASARGADAE) calls it \"the spacious capital\" of Cyrus; Schmitt (Achaemenid dynasty) keeps the seat of government at Ecbatana under Cyrus. Construction dated from about 540 BCE onwards. Evidence: scholarly-or-primary."
