note: "Tier: scholarly (older manual, superseded by C. E. Bosworth, The New Islamic Dynasties, 1996). Consulted: yes - via Chief of Staff transcription of archive.org page images (item in.ernet.dli.2015.358147; Digital Library of India / JaiGyan scan, often faint). Years copied as printed (A.H. only, often with day and month of accession). A.D. years were converted with the standard tabular Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Page or section numbers are given on each fact that cites this source. Two readings marked unclear in the transcription are noted on the relevant facts."
