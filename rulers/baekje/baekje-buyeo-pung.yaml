note: "Reign as given: 660–663 (Wikipedia list); EKC: to 663 CE (one bound only). Start 660 CE; end 663 CE. Korean name: 부여풍 (EKC article title). Personal name (Wikipedia list): Buyeo Pung / Buyeo Pungjang. Leader of the Baekje restoration movement after the fall of Sabi (660); EKC: fled to Goguryeo after the defeat at Baekgang in 663. Outside the baekje polity span. Wikidata: Q706581 (via wp-en-wikidata-korea; verify item scope before use). Evidence: scholarly-partial."
