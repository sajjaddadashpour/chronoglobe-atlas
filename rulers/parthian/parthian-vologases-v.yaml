note: "Reign as given: 207/208 - 213 (Wikipedia) or 207-227/228 (Iranica, as Vologeses VI). Start 207 CE; end 213 CE to 228 CE. Numbering differs: Iranica calls him Vologeses VI. Iranica keeps him reigning (as rival of Artabanus IV) to 227/28; Wikipedia ends 213. The Wikipedia row cites: Venning 2023 p. 164. Evidence: scholarly-or-primary."
