note: "Reign as given: 1492–1496. Start 1492 CE; end 1496 CE. The Wikipedia row cites: Truhart 1985 p. 2043. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 254, § 91: A.H. 897 = 4 November 1491–23 October 1492 CE (Julian, tabular); ended A.H. 902 = 9 September 1496–28 August 1497 CE (Julian, tabular). Printed A.D. year(s): 1491–1496. Zambaur 1927, § 246 p. 258: A.H. 897 = 4 November 1491–23 October 1492 CE (Julian, tabular); ended A.H. 902 = 9 September 1496–28 August 1497 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
