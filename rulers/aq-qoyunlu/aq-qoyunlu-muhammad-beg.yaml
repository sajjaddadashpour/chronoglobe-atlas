note: "Reign as given: 1499–1500. Start 1499 CE; end 1500 CE. Iranica: died summer 1500. The Wikipedia row cites: Truhart 1985 p. 2043. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 254, § 91: A.H. 906 = 28 July 1500–17 July 1501 CE (Julian, tabular); ended A.H. 907 = 17 July 1501–5 July 1502 CE (Julian, tabular). Printed A.D. year(s): 1500–1501. Zambaur 1927, § 246 p. 258: A.H. 906 = 28 July 1500–17 July 1501 CE (Julian, tabular); ended A.H. 907 = 17 July 1501–5 July 1502 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
