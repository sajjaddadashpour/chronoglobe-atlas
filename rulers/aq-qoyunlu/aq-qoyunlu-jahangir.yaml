note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 1444 CE to 1445 CE; end 1453 CE to 1466 CE. Lane-Poole 1894, p. 254, § 91: A.H. 848 = 20 April 1444–9 April 1445 CE (Julian, tabular); ended A.H. 871 = 13 August 1466–1 August 1467 CE (Julian, tabular). Printed A.D. year(s): 1444–1466. Zambaur 1927, § 246 p. 258: A.H. 848 = 20 April 1444–9 April 1445 CE (Julian, tabular); ended A.H. 857 = 12 January 1453–1 January 1454 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
