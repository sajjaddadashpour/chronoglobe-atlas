note: "Reign as given: autumn 1452 (Āmed) - 1478; over Iran from 1467/69. Start 1452 CE to 1453 CE; end 1478 CE. Iranica: seized Āmed autumn 1452; Wikipedia Iran list counts from 1465/1469. The Wikipedia row cites: Truhart 1985 p. 2043. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 254, § 91: A.H. 871 = 13 August 1466–1 August 1467 CE (Julian, tabular); ended A.H. 883 = 4 April 1478–23 March 1479 CE (Julian, tabular). Printed A.D. year(s): 1466–1478. Zambaur 1927, § 246 p. 258: A.H. 857 = 12 January 1453–1 January 1454 CE (Julian, tabular); ended A.H. 883 = 4 April 1478–23 March 1479 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
