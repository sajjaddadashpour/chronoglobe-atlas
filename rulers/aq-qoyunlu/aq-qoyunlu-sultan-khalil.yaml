note: "Reign as given: 1478. Start 1478 CE; end 1478 CE. The Wikipedia row cites: Truhart 1985 p. 2043. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 254, § 91: A.H. 883 = 4 April 1478–23 March 1479 CE (Julian, tabular); ended A.H. 884 = 25 March 1479–13 March 1480 CE (Julian, tabular). Printed A.D. year(s): 1478–1479. Zambaur 1927, § 246 p. 258: A.H. 883 = 4 April 1478–23 March 1479 CE (Julian, tabular); ended A.H. 884 = 25 March 1479–13 March 1480 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
