note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 1411 CE to 1412 CE; end 1411 CE to 1412 CE. Zambaur 1927, § 238 p. 253: A.H. 814 = 25 April 1411–12 April 1412 CE (Julian, tabular); ended A.H. 814 = 25 April 1411–12 April 1412 CE (Julian, tabular). Widow and regent; both the year 814 and the next name are printed. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
