note: "Reign as given: 1411/12 - ? (held Šuštar for 2 years). Start 1411 CE to 1412 CE; end unknown. End year unknown; latest is the polity end bound (1432 CE), not a reign date. [Iran pass 2: that unknown bound has now been filled from Lane-Poole and/or Zambaur; earliest/latest are no longer the polity placeholder.] Evidence: scholarly-or-primary. Zambaur 1927, § 238 p. 253: A.H. 814 = 25 April 1411–12 April 1412 CE (Julian, tabular); ended A.H. 827 = 5 December 1423–23 November 1424 CE (Julian, tabular). Under Tandu's tutelage. Combined regional or interrupted dates from the same book: 1411–1412 to 1415–1416 (Zambaur § 238 p. 253: A.H. 814–818; tabular Islamic calendar, Julian years) | 1421–1422 to 1423–1424 (Zambaur § 238 p. 253: A.H. 825–827; tabular Islamic calendar, Julian years) Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
