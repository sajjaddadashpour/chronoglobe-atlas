note: "Reign as given: 1356 - 9 Oct 1374. Start 1356 CE; end 1374 CE. Conquered Azarbaijan 1359; died in Tabriz. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 248, § 86: A.H. 757 = 5 January 1356–23 December 1356 CE (Julian, tabular); ended A.H. 777 = 2 June 1375–21 May 1376 CE (Julian, tabular). Printed A.D. year(s): 1356–1374. Zambaur 1927, § 238 p. 253: A.H. 757 = 5 January 1356–23 December 1356 CE (Julian, tabular); ended 8 November 1374 CE (Julian; A.H. 2 Jumada II 776). Died 2 Jumada II 776. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
