note: "Reign as given: 1382–1410. Start 1382 CE; end 1410 CE. Repeatedly expelled by Timur; executed 1410. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 248, § 86: A.H. 784 = 17 March 1382–5 March 1383 CE (Julian, tabular); ended A.H. 813 = 6 May 1410–25 April 1411 CE (Julian, tabular). Printed A.D. year(s): 1382–1410. Zambaur 1927, § 238 p. 253: A.H. 784 = 17 March 1382–5 March 1383 CE (Julian, tabular); ended Rabi' II 813 = 3 August 1410–31 August 1410 CE (Julian) Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
