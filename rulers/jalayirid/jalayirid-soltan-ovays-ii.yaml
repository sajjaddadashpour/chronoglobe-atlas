note: "Reign as given: ? - 1421 (killed). Start unknown; end 1421 CE. Start year unknown; earliest is the polity start bound (1336 CE), not a reign date. [Iran pass 2: that unknown bound has now been filled from Lane-Poole and/or Zambaur; earliest/latest are no longer the polity placeholder.] Evidence: scholarly-or-primary. Zambaur 1927, § 238 p. 253: A.H. 818 = 13 March 1415–1 March 1416 CE (Julian, tabular); ended A.H. 824 = 6 January 1421–26 December 1421 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
