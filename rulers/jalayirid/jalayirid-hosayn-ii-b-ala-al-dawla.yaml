note: "Reign as given: ? - 9 Nov 1431. Start unknown; end 1431 CE. Start year unknown; earliest is the polity start bound (1336 CE), not a reign date. [Iran pass 2: that unknown bound has now been filled from Lane-Poole and/or Zambaur; earliest/latest are no longer the polity placeholder.] Evidence: scholarly-or-primary. Zambaur 1927, § 238 p. 253: A.H. 827 = 5 December 1423–23 November 1424 CE (Julian, tabular); end year not printed. Zambaur prints only the accession year 827; no closing year is given on this leaf. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
