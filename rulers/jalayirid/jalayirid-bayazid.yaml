note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 1382 CE to 1383 CE; end 1383 CE to 1384 CE. Lane-Poole 1894, p. 248, § 86: A.H. 784 = 17 March 1382–5 March 1383 CE (Julian, tabular); ended A.H. 785 = 6 March 1383–22 February 1384 CE (Julian, tabular). Lane-Poole prints A.H. 784-5 and leaves the A.D. column blank. Zambaur 1927, § 238 p. 253: A.H. 784 = 17 March 1382–5 March 1383 CE (Julian, tabular); ended A.H. 785 = 6 March 1383–22 February 1384 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
