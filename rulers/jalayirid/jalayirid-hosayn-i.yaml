note: "Reign as given: 1374–1382. Start 1374 CE; end 1382 CE. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 248, § 86: A.H. 777 = 2 June 1375–21 May 1376 CE (Julian, tabular); ended A.H. 784 = 17 March 1382–5 March 1383 CE (Julian, tabular). Printed A.D. year(s): 1374–1382. Zambaur 1927, § 238 p. 253: Jumada II 776 = 7 November 1374–5 December 1374 CE (Julian); ended A.H. 784 = 17 March 1382–5 March 1383 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
