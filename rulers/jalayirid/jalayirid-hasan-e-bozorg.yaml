note: "Reign as given: 1336 - July 1356. Start 1336 CE; end 1356 CE. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 248, § 86: A.H. 736 = 21 August 1335–8 August 1336 CE (Julian, tabular); ended A.H. 757 = 5 January 1356–23 December 1356 CE (Julian, tabular). Printed A.D. year(s): 1336–1356. Zambaur 1927, § 238 p. 253: A.H. 736 = 21 August 1335–8 August 1336 CE (Julian, tabular); ended A.H. 757 = 5 January 1356–23 December 1356 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
