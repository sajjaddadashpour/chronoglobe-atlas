note: "Reign as given: 1410 - 1411/12. Start 1410 CE; end 1411 CE to 1412 CE. Iranica: lost Baghdad 1412; Wikipedia 1410-1411. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 248, § 86: A.H. 813 = 6 May 1410–25 April 1411 CE (Julian, tabular); ended A.H. 814 = 25 April 1411–12 April 1412 CE (Julian, tabular). Printed A.D. year(s): 1410–1411. Zambaur 1927, § 238 p. 253: Rabi' II 813 = 3 August 1410–31 August 1410 CE (Julian); ended A.H. 814 = 25 April 1411–12 April 1412 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
