note: "Reign as given: 984-979 BCE. Start 984 BCE; end 979 BCE. Potts 1999 (1st ed.) p. 262: 'the dynasty consisted of a single ruler, Mar-biti-apla-usur (984–979 BC) who, in spite of his Akkadian name, was called \\'remote (?) descendant of Elam\\' in the Dynastic Chronicle (Brinkman 1968: 165).' This is the so-called Elamite dynasty of Babylon, not a king of Elam in Elam itself; recorded here because Potts discusses him in the Neo-Elamite chapter. Consulted via Chief of Staff transcription of archive.org page images. Verify against page; read at screen resolution. Evidence: scholarly-or-primary."
