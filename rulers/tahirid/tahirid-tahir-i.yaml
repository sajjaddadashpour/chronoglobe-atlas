note: "Reign as given: 821–822. Start 821 CE; end 822 CE. The Wikipedia row cites: Daryaee 2012 p. 394. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 128, § 52: A.H. 205 = 17 June 820–6 June 821 CE (Julian, tabular); ended A.H. 207 = 27 May 822–16 May 823 CE (Julian, tabular). Printed A.D. year(s): 820–822. Zambaur 1927, § 187 p. 197: A.H. 205 = 17 June 820–6 June 821 CE (Julian, tabular); ended 14 November 822 CE (Julian; A.H. 24 Jumada II 207). Born 159; died 24 Jumada II 207. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
