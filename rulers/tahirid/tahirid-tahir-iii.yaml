confidence: scholarly-consensus
note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 872 CE to 873 CE; end 874 CE to 875 CE. Zambaur 1927, § 187 p. 197: A.H. 259 = 7 November 872–27 October 873 CE (Julian, tabular); ended A.H. 261 = 16 October 874–4 October 875 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
