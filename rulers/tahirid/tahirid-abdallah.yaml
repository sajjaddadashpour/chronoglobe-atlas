note: "Reign as given: 828–845. Start 828 CE; end 845 CE. Iranica 828-45; moved the seat from Marv to Nishapur. The Wikipedia row cites: Daryaee 2012 p. 394. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 128, § 52: A.H. 213 = 22 March 828–11 March 829 CE (Julian, tabular); ended A.H. 230 = 18 September 844–6 September 845 CE (Julian, tabular). Printed A.D. year(s): 828–844. Zambaur 1927, § 187 p. 197: Rajab 213 = 15 September 828–14 October 828 CE (Julian); ended A.H. 230 = 18 September 844–6 September 845 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
