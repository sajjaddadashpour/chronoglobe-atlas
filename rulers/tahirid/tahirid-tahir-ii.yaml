note: "Reign as given: 845–862. Start 845 CE; end 862 CE. The Wikipedia row cites: Daryaee 2012 p. 394. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 128, § 52: A.H. 230 = 18 September 844–6 September 845 CE (Julian, tabular); ended A.H. 248 = 7 March 862–24 February 863 CE (Julian, tabular). Printed A.D. year(s): 844–862. Zambaur 1927, § 187 p. 197: A.H. 230 = 18 September 844–6 September 845 CE (Julian, tabular); ended A.H. 248 = 7 March 862–24 February 863 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
