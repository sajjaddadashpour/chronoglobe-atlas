note: "Reign as given: 822–828. Start 822 CE; end 828 CE. The Wikipedia row cites: Daryaee 2012 p. 394. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 128, § 52: A.H. 207 = 27 May 822–16 May 823 CE (Julian, tabular); ended A.H. 213 = 22 March 828–11 March 829 CE (Julian, tabular). Printed A.D. year(s): 822–828. Zambaur 1927, § 187 p. 197: Jumada II 207 = 22 October 822–19 November 822 CE (Julian); ended Rajab 213 = 15 September 828–14 October 828 CE (Julian). Lieutenant of his brother Abdallah. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
