note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 932 CE; end 934 CE. Lane-Poole 1894, pp. 12–13: A.H. 320 = 13 January 932–31 December 932 CE (Julian, tabular); ended A.H. 322 = 22 December 933–11 December 934 CE (Julian, tabular). Printed A.D. year(s): 932–934. Zambaur 1927, § 4 pp. 4–5: 31 October 932 CE (Julian; A.H. 27 Shawwal 320); ended 24 April 934 CE (Julian; A.H. 6 Jumada I 322). Deposed 6 Jumada I 322; died Jumada I 339. A two-day proclamation in Muharram 317 is listed separately and is not treated as a reign here. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
