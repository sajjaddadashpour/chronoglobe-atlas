note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 1180 CE; end 1225 CE. Lane-Poole 1894, pp. 12–13: A.H. 575 = 8 June 1179–26 May 1180 CE (Julian, tabular); ended A.H. 622 = 13 January 1225–2 January 1226 CE (Julian, tabular). Printed A.D. year(s): 1180–1225. Zambaur 1927, § 4 pp. 4–5: 30 March 1180 CE (Julian; A.H. 2 Dhu l-Qa'da 575); ended 5 October 1225 CE (Julian; A.H. 30 Ramadan 622) Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
