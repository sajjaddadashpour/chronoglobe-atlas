note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 940 CE; end 944 CE. Lane-Poole 1894, pp. 12–13: A.H. 329 = 6 October 940–24 September 941 CE (Julian, tabular); ended A.H. 333 = 24 August 944–13 August 945 CE (Julian, tabular). Printed A.D. year(s): 940–944. Zambaur 1927, § 4 pp. 4–5: 23 December 940 CE (Julian; A.H. 20 Rabi' I 329); ended 12 October 944 CE (Julian; A.H. 20 Safar 333). Deposed 20 Safar 333; died 357. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
