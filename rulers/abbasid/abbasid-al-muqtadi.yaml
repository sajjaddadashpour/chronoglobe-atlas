note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 1075 CE; end 1094 CE. Lane-Poole 1894, pp. 12–13: A.H. 467 = 27 August 1074–16 August 1075 CE (Julian, tabular); ended A.H. 487 = 21 January 1094–9 January 1095 CE (Julian, tabular). Printed A.D. year(s): 1075–1094. Zambaur 1927, § 4 pp. 4–5: 3 April 1075 CE (Julian; A.H. 13 Sha'ban 467); ended 4 February 1094 CE (Julian; A.H. 15 Muharram 487) Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
