note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 974 CE; end 991 CE. Lane-Poole 1894, pp. 12–13: A.H. 363 = 2 October 973–21 September 974 CE (Julian, tabular); ended A.H. 381 = 20 March 991–7 March 992 CE (Julian, tabular). Printed A.D. year(s): 974–991. Zambaur 1927, § 4 pp. 4–5: 5 August 974 CE (Julian; A.H. 13 Dhu l-Qa'da 363); ended 1 October 991 CE (Julian; A.H. 19 Rajab 381) Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
