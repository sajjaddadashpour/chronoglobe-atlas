note: "Reign as given: 6 November 749 – 9 June 754. Start 749 CE; end 754 CE. The Wikipedia row cites: Ross 1977 p. 1. Evidence: scholarly-or-primary. Lane-Poole 1894, pp. 12–13: A.H. 132 = 20 August 749–8 August 750 CE (Julian, tabular); ended A.H. 136 = 7 July 753–25 June 754 CE (Julian, tabular). Printed A.D. year(s): 750–754. Zambaur 1927, § 4 pp. 4–5: A.H. 132 = 20 August 749–8 August 750 CE (Julian, tabular); ended A.H. 136 = 7 July 753–25 June 754 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
