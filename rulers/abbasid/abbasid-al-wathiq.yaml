note: "Reign as given: 5 January 842 – 10 August 847. Start 842 CE; end 847 CE. The Wikipedia row cites: Ross 1977 p. 2. Evidence: scholarly-or-primary. Lane-Poole 1894, pp. 12–13: A.H. 227 = 21 October 841–10 October 842 CE (Julian, tabular); ended A.H. 232 = 28 August 846–17 August 847 CE (Julian, tabular). Printed A.D. year(s): 842–847. Zambaur 1927, § 4 pp. 4–5: A.H. 227 = 21 October 841–10 October 842 CE (Julian, tabular); ended A.H. 232 = 28 August 846–17 August 847 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
