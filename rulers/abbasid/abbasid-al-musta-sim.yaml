note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 1242 CE; end 1258 CE. Lane-Poole 1894, pp. 12–13: A.H. 640 = 1 July 1242–19 June 1243 CE (Julian, tabular); ended A.H. 656 = 8 January 1258–27 December 1258 CE (Julian, tabular). Printed A.D. year(s): 1242–1258. Zambaur 1927, § 4 pp. 4–5: 5 December 1242 CE (Julian; A.H. 10 Jumada II 640); ended 20 February 1258 CE (Julian; A.H. 14 Safar 656). Put to death by Hulagu on 14 Safar 656. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
