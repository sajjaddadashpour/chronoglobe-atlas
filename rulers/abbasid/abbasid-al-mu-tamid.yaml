note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 870 CE; end 892 CE. Lane-Poole 1894, pp. 12–13: A.H. 256 = 9 December 869–27 November 870 CE (Julian, tabular); ended A.H. 279 = 3 April 892–22 March 893 CE (Julian, tabular). Printed A.D. year(s): 870–892. Zambaur 1927, § 4 pp. 4–5: 21 June 870 CE (Julian; A.H. 18 Rajab 256); ended 16 October 892 CE (Julian; A.H. 20 Rajab 279) Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
