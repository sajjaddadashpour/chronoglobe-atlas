note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 946 CE; end 974 CE. Lane-Poole 1894, pp. 12–13: A.H. 334 = 13 August 945–1 August 946 CE (Julian, tabular); ended A.H. 363 = 2 October 973–21 September 974 CE (Julian, tabular). Printed A.D. year(s): 946–974. Zambaur 1927, § 4 pp. 4–5: 19 January 946 CE (Julian; A.H. 12 Jumada II 334); ended 5 August 974 CE (Julian; A.H. 13 Dhu l-Qa'da 363) Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
