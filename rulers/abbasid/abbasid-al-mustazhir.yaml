note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 1094 CE; end 1118 CE. Lane-Poole 1894, pp. 12–13: A.H. 487 = 21 January 1094–9 January 1095 CE (Julian, tabular); ended A.H. 512 = 24 April 1118–12 April 1119 CE (Julian, tabular). Printed A.D. year(s): 1094–1118. Zambaur 1927, § 4 pp. 4–5: 4 February 1094 CE (Julian; A.H. 15 Muharram 487); ended 6 August 1118 CE (Julian; A.H. 16 Rabi' II 512) Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
