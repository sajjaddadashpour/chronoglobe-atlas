note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 908 CE; end 932 CE. Lane-Poole 1894, pp. 12–13: A.H. 295 = 12 October 907–30 September 908 CE (Julian, tabular); ended A.H. 320 = 13 January 932–31 December 932 CE (Julian, tabular). Printed A.D. year(s): 908–932. Zambaur 1927, § 4 pp. 4–5: 13 August 908 CE (Julian; A.H. 12 Dhu l-Qa'da 295); ended 31 October 932 CE (Julian; A.H. 27 Shawwal 320) Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
