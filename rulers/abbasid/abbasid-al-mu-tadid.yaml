note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 892 CE; end 902 CE. Lane-Poole 1894, pp. 12–13: A.H. 279 = 3 April 892–22 March 893 CE (Julian, tabular); ended A.H. 289 = 16 December 901–5 December 902 CE (Julian, tabular). Printed A.D. year(s): 892–902. Zambaur 1927, § 4 pp. 4–5: 16 October 892 CE (Julian; A.H. 20 Rajab 279); ended 5 April 902 CE (Julian; A.H. 22 Rabi' II 289) Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
