note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 934 CE; end 940 CE. Lane-Poole 1894, pp. 12–13: A.H. 322 = 22 December 933–11 December 934 CE (Julian, tabular); ended A.H. 329 = 6 October 940–24 September 941 CE (Julian, tabular). Printed A.D. year(s): 934–940. Zambaur 1927, § 4 pp. 4–5: 24 April 934 CE (Julian; A.H. 6 Jumada I 322); ended 18 December 940 CE (Julian; A.H. 15 Rabi' I 329). Died 15 Rabi' I 329; successor elected five days later. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
