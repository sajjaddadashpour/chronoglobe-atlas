note: "Reign as given: 7 October 775 – 4 August 785. Start 775 CE; end 785 CE. The Wikipedia row cites: Ross 1977 p. 1. Evidence: scholarly-or-primary. Lane-Poole 1894, pp. 12–13: A.H. 158 = 11 November 774–31 October 775 CE (Julian, tabular); ended A.H. 169 = 14 July 785–3 July 786 CE (Julian, tabular). Printed A.D. year(s): 775–785. Zambaur 1927, § 4 pp. 4–5: A.H. 158 = 11 November 774–31 October 775 CE (Julian, tabular); ended A.H. 169 = 14 July 785–3 July 786 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
