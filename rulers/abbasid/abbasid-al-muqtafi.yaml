note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 1136 CE; end 1160 CE. Lane-Poole 1894, pp. 12–13: A.H. 530 = 11 October 1135–28 September 1136 CE (Julian, tabular); ended A.H. 555 = 12 January 1160–30 December 1160 CE (Julian, tabular). Printed A.D. year(s): 1136–1160. Zambaur 1927, § 4 pp. 4–5: 18 August 1136 CE (Julian; A.H. 18 Dhu l-Qa'da 530); ended 12 March 1160 CE (Julian; A.H. 2 Rabi' I 555) Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
