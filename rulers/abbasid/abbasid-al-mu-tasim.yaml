note: "Reign as given: 7 August 833 – 5 January 842. Start 833 CE; end 842 CE. The Wikipedia row cites: Ross 1977 p. 2. Evidence: scholarly-or-primary. Lane-Poole 1894, pp. 12–13: A.H. 218 = 27 January 833–16 January 834 CE (Julian, tabular); ended A.H. 227 = 21 October 841–10 October 842 CE (Julian, tabular). Printed A.D. year(s): 833–842. Zambaur 1927, § 4 pp. 4–5: A.H. 218 = 27 January 833–16 January 834 CE (Julian, tabular); ended A.H. 227 = 21 October 841–10 October 842 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
