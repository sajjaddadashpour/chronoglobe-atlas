note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 866 CE; end 869 CE. Lane-Poole 1894, pp. 12–13: A.H. 251 = 2 February 865–22 January 866 CE (Julian, tabular); ended A.H. 255 = 20 December 868–8 December 869 CE (Julian, tabular). Printed A.D. year(s): 866–869. Zambaur 1927, § 4 pp. 4–5: 25 January 866 CE (Julian; A.H. 4 Muharram 252); ended 11 July 869 CE (Julian; A.H. 27 Rajab 255). Footnote: coins dated 251 show he assumed power already in Dhu l-Hijja 251. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
