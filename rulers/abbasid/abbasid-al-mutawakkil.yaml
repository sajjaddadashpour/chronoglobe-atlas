note: "Reign as given: 10 August 847 – 11 December 861. Start 847 CE; end 861 CE. The Wikipedia row cites: Ross 1977 p. 2. Evidence: scholarly-or-primary. Lane-Poole 1894, pp. 12–13: A.H. 232 = 28 August 846–17 August 847 CE (Julian, tabular); ended A.H. 247 = 17 March 861–5 March 862 CE (Julian, tabular). Printed A.D. year(s): 847–861. Zambaur 1927, § 4 pp. 4–5: A.H. 232 = 28 August 846–17 August 847 CE (Julian, tabular); ended 11 December 861 CE (Julian; A.H. 4 Shawwal 247) Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
