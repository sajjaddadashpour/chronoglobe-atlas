note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 1226 CE; end 1242 CE. Lane-Poole 1894, pp. 12–13: A.H. 623 = 2 January 1226–21 December 1226 CE (Julian, tabular); ended A.H. 640 = 1 July 1242–19 June 1243 CE (Julian, tabular). Printed A.D. year(s): 1226–1242. Zambaur 1927, § 4 pp. 4–5: 11 July 1226 CE (Julian; A.H. 14 Rajab 623); ended 5 December 1242 CE (Julian; A.H. 10 Jumada II 640) Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
