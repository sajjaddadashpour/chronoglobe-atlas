note: "Reign as given: 27 September 813 – 7 August 833. Start 813 CE; end 833 CE. The Wikipedia row cites: Ross 1977 pp. 1–2. Evidence: scholarly-or-primary. Lane-Poole 1894, pp. 12–13: A.H. 198 = 1 September 813–20 August 814 CE (Julian, tabular); ended A.H. 218 = 27 January 833–16 January 834 CE (Julian, tabular). Printed A.D. year(s): 813–833. Zambaur 1927, § 4 pp. 4–5: A.H. 198 = 1 September 813–20 August 814 CE (Julian, tabular); ended A.H. 218 = 27 January 833–16 January 834 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
