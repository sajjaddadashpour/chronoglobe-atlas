note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 944 CE; end 946 CE. Lane-Poole 1894, pp. 12–13: A.H. 333 = 24 August 944–13 August 945 CE (Julian, tabular); ended A.H. 334 = 13 August 945–1 August 946 CE (Julian, tabular). Printed A.D. year(s): 944–946. Zambaur 1927, § 4 pp. 4–5: 12 October 944 CE (Julian; A.H. 20 Safar 333); ended 19 January 946 CE (Julian; A.H. 12 Jumada II 334) Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
