note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 861 CE; end 862 CE. Lane-Poole 1894, pp. 12–13: A.H. 247 = 17 March 861–5 March 862 CE (Julian, tabular); ended A.H. 248 = 7 March 862–24 February 863 CE (Julian, tabular). Printed A.D. year(s): 861–862. Zambaur 1927, § 4 pp. 4–5: 11 December 861 CE (Julian; A.H. 4 Shawwal 247); ended 6 June 862 CE (Julian; A.H. 3 Rabi' II 248) Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
