note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 902 CE; end 908 CE. Lane-Poole 1894, pp. 12–13: A.H. 289 = 16 December 901–5 December 902 CE (Julian, tabular); ended A.H. 295 = 12 October 907–30 September 908 CE (Julian, tabular). Printed A.D. year(s): 902–908. Zambaur 1927, § 4 pp. 4–5: 5 April 902 CE (Julian; A.H. 22 Rabi' II 289); ended 13 August 908 CE (Julian; A.H. 12 Dhu l-Qa'da 295) Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
