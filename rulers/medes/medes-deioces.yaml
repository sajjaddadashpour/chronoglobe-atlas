note: "Reign as given: Herodotus 53 yrs; c. 700-647 / 728-675 / 700-678 / 672-640s BCE. Start 728 BCE to 672 BCE; end 678 BCE to 647 BCE. Existence as king rests on Herodotus. All four chronologies below are scholarly reconstructions; none is attested. Cross-check (wp-en-list-of-monarchs-of-iran): Wikipedia list uses Diakonoff 2003 chronology: Deioces c.727-675, Phraortes c.674-653, Cyaxares c.624-585, Astyages c.584-550. Chronologies (kept in note because alternatives are only allowed on contested facts, and this fact is legendary): A (Herodotus from 550): c. 700-647 BCE [eir-media-ii]; B (Diakonoff/Cameron): c. 728/727-675 BCE [eir-media-ii, eir-deioces]; Rawlinson/Medvedskaya: 700-678 BCE [eir-media-ii]; Grantovskiĭ: c. 672/671 - 640s BCE [eir-media-ii]. Evidence: scholarly-or-primary."
