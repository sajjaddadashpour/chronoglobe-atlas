note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 1346 CE to 1347 CE; end 1347 CE to 1348 CE. Lane-Poole 1894, p. 251, § 88: A.H. 747 = 24 April 1346–13 April 1347 CE (Julian, tabular); ended A.H. 748 = 13 April 1347–31 March 1348 CE (Julian, tabular). Printed A.D. year(s): 1346–1347. Zambaur 1927, § 242 p. 256: A.H. 747 = 24 April 1346–13 April 1347 CE (Julian, tabular); ended A.H. 748 = 13 April 1347–31 March 1348 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
