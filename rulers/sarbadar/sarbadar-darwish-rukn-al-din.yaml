note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 1376 CE to 1377 CE; end 1378 CE to 1379 CE. Zambaur 1927, § 242 p. 256: A.H. 778 = 21 May 1376–9 May 1377 CE (Julian, tabular); ended A.H. 780 = 30 April 1378–19 April 1379 CE (Julian, tabular). Usurper, 778-780. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
