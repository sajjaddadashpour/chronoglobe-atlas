note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 1352 CE to 1353 CE; end 1355 CE to 1358 CE. Lane-Poole 1894, p. 251, § 88: A.H. 753 = 18 February 1352–6 February 1353 CE (Julian, tabular); ended A.H. 756 = 16 January 1355–5 January 1356 CE (Julian, tabular). Printed A.D. year(s): 1352–1355. Zambaur 1927, § 242 p. 256: A.H. 753 = 18 February 1352–6 February 1353 CE (Julian, tabular); ended A.H. 759 = 14 December 1357–2 December 1358 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
