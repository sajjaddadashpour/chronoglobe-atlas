note: "Reign as given: 1337 (Sabzevār) - June 1338. Start 1332 CE to 1337 CE; end 1338 CE. Wikipedia gives 1332-1338 in one list and 1336-1338 in another. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 251, § 88: A.H. 737 = 10 August 1336–30 July 1337 CE (Julian, tabular); ended A.H. 738 = 30 July 1337–18 July 1338 CE (Julian, tabular). Printed A.D. year(s): 1337–1338. Zambaur 1927, § 242 p. 256: A.H. 737 = 10 August 1336–30 July 1337 CE (Julian, tabular); ended A.H. 738 = 30 July 1337–18 July 1338 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
