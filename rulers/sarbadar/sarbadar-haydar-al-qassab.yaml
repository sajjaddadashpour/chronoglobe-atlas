note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 1358 CE to 1359 CE; end 1358 CE to 1359 CE. Lane-Poole 1894, p. 251, § 88: A.H. 760 = 3 December 1358–21 November 1359 CE (Julian, tabular); ended A.H. 760 = 3 December 1358–21 November 1359 CE (Julian, tabular). Printed A.D. year(s): 1359–1359. Zambaur 1927, § 242 p. 256: A.H. 760 = 3 December 1358–21 November 1359 CE (Julian, tabular); ended A.H. 760 = 3 December 1358–21 November 1359 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
