note: "Reign as given: June 1338 - 1343/44. Start 1338 CE; end 1343 CE to 1344 CE. End year from Wikipedia (1343); not extracted from Iranica. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 251, § 88: A.H. 738 = 30 July 1337–18 July 1338 CE (Julian, tabular); ended A.H. 744 = 26 May 1343–13 May 1344 CE (Julian, tabular). Printed A.D. year(s): 1338–1344. Zambaur 1927, § 242 p. 256: A.H. 738 = 30 July 1337–18 July 1338 CE (Julian, tabular); ended A.H. 744 = 26 May 1343–13 May 1344 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
