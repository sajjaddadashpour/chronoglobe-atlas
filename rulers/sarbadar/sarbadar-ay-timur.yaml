note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 1343 CE to 1344 CE; end 1345 CE to 1346 CE. Lane-Poole 1894, p. 251, § 88: A.H. 744 = 26 May 1343–13 May 1344 CE (Julian, tabular); ended A.H. 746 = 4 May 1345–22 April 1346 CE (Julian, tabular). Printed A.D. year(s): 1344–1346. Zambaur 1927, § 242 p. 256: A.H. 744 = 26 May 1343–13 May 1344 CE (Julian, tabular); ended A.H. 746 = 4 May 1345–22 April 1346 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
