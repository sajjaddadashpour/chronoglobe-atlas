note: "Reign as given: ? - 763/1362 (assassinated). Start 1361 CE; end 1362 CE. Iranica: assassinated 1362; Wikipedia 1361-1364. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 251, § 88: A.H. 761 = 23 November 1359–11 November 1360 CE (Julian, tabular); ended A.H. 766 = 28 September 1364–16 September 1365 CE (Julian, tabular). Printed A.D. year(s): 1360–1364. Zambaur 1927, § 242 p. 256: A.H. 761 = 23 November 1359–11 November 1360 CE (Julian, tabular); ended A.H. 766 = 28 September 1364–16 September 1365 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
