note: "Reign as given: 1420/21 - 1436/38. Start 1420 CE to 1421 CE; end 1436 CE to 1438 CE. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 253, § 90: A.H. 823 = 17 January 1420–4 January 1421 CE (Julian, tabular); ended A.H. 841 = 5 July 1437–23 June 1438 CE (Julian, tabular). Printed A.D. year(s): 1420–1437. Zambaur 1927, § 245 p. 257: A.H. 823 = 17 January 1420–4 January 1421 CE (Julian, tabular); ended A.H. 841 = 5 July 1437–23 June 1438 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
