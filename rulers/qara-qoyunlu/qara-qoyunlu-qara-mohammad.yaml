note: "Reign as given: 1378/80 - 1388/89. Start 1378 CE to 1380 CE; end 1388 CE to 1389 CE. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 253, § 90: A.H. 780 = 30 April 1378–19 April 1379 CE (Julian, tabular); ended A.H. 790 = 11 January 1388–29 December 1388 CE (Julian, tabular). Printed A.D. year(s): 1378–1388. Zambaur 1927, § 245 p. 257: A.H. 780 = 30 April 1378–19 April 1379 CE (Julian, tabular); ended A.H. 790 = 11 January 1388–29 December 1388 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
