note: "Reign as given: 1467 - 1468/Jan 1469. Start 1467 CE; end 1468 CE to 1469 CE. Captured January 1469 (Iranica). Evidence: scholarly-or-primary. Lane-Poole 1894, p. 253, § 90: A.H. 872 = 2 August 1467–20 July 1468 CE (Julian, tabular); ended A.H. 874 = 11 July 1469–29 June 1470 CE (Julian, tabular). Printed A.D. year(s): 1467–1469. Zambaur 1927, § 245 p. 257: Rabi' II 872 = 30 October 1467–27 November 1467 CE (Julian); ended A.H. 873 = 22 July 1468–11 July 1469 CE (Julian, tabular). Executed by Uzun Hasan in 873. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
