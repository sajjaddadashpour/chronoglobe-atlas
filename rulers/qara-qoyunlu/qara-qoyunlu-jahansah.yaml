note: "Reign as given: 1436/38 - 1467. Start 1436 CE to 1438 CE; end 1467 CE. Crowned 19 Apr 1438 (Wikipedia); killed 1467 (Iranica Aq Qoyunlu). Evidence: scholarly-or-primary. Lane-Poole 1894, p. 253, § 90: A.H. 841 = 5 July 1437–23 June 1438 CE (Julian, tabular); ended A.H. 872 = 2 August 1467–20 July 1468 CE (Julian, tabular). Printed A.D. year(s): 1437–1467. Zambaur 1927, § 245 p. 257: A.H. 841 = 5 July 1437–23 June 1438 CE (Julian, tabular); ended Rabi' II 872 = 30 October 1467–27 November 1467 CE (Julian) Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
