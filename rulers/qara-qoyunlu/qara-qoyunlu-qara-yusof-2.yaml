note: "Reign as given: 1405/06 - Dec 1420. Start 1405 CE to 1406 CE; end 1420 CE. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 253, § 90: A.H. 808 = 29 June 1405–17 June 1406 CE (Julian, tabular); ended A.H. 823 = 17 January 1420–4 January 1421 CE (Julian, tabular). Printed A.D. year(s): 1405–1420. Zambaur 1927, § 245 p. 257: A.H. 808 = 29 June 1405–17 June 1406 CE (Julian, tabular); ended Dhu l-Hijja 822 = 19 December 1419–16 January 1420 CE (Julian). Died Dhu l-Hijja 822. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
