note: "Reign as given: 1277/78 - 1295 (Wikipedia) or d. 1305/06 (Iranica). Start 1277 CE to 1278 CE; end 1295 CE to 1306 CE. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 252, § 89: A.H. 677 = 25 May 1278–14 May 1279 CE (Julian, tabular); ended A.H. 682 = 1 April 1283–20 March 1284 CE (Julian, tabular). Printed A.D. year(s): 1278–1283. Printed 677-82 / 1278-83 as contemporary with Shams al-Din I. Zambaur 1927, § 244 pp. 256–257: A.H. 677 = 25 May 1278–14 May 1279 CE (Julian, tabular); ended A.H. 682 = 1 April 1283–20 March 1284 CE (Julian, tabular). Coregent 677-682. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
