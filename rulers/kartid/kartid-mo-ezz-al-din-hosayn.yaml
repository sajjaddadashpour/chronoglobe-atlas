note: "Reign as given: 1331/32 - 1370/71. Start 1331 CE to 1332 CE; end 1370 CE to 1371 CE. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 252, § 89: A.H. 732 = 4 October 1331–21 September 1332 CE (Julian, tabular); ended A.H. 772 = 26 July 1370–15 July 1371 CE (Julian, tabular). Printed A.D. year(s): 1331–1370. Zambaur 1927, § 244 pp. 256–257: A.H. 732 = 4 October 1331–21 September 1332 CE (Julian, tabular); ended A.H. 772 = 26 July 1370–15 July 1371 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
