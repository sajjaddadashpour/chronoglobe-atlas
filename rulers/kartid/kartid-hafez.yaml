note: "Reign as given: 1329/30–1331/32. Start 1329 CE to 1330 CE; end 1331 CE to 1332 CE. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 252, § 89: A.H. 730 = 25 October 1329–13 October 1330 CE (Julian, tabular); ended A.H. 732 = 4 October 1331–21 September 1332 CE (Julian, tabular). Printed A.D. year(s): 1329–1331. Zambaur 1927, § 244 pp. 256–257: A.H. 730 = 25 October 1329–13 October 1330 CE (Julian, tabular); ended A.H. 732 = 4 October 1331–21 September 1332 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
