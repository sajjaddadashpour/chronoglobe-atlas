note: "Reign as given: 1295–1308. Start 1295 CE; end 1308 CE. Died 1308 (Iranica). Evidence: scholarly-or-primary. Lane-Poole 1894, p. 252, § 89: A.H. 684 = 9 March 1285–25 February 1286 CE (Julian, tabular); ended A.H. 708 = 21 June 1308–9 June 1309 CE (Julian, tabular). Printed A.D. year(s): 1285–1308. Zambaur 1927, § 244 pp. 256–257: A.H. 684 = 9 March 1285–25 February 1286 CE (Julian, tabular); ended A.H. 706 = 13 July 1306–1 July 1307 CE (Julian, tabular). Friend of Amir Chupan. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
