note: "Reign as given: 1245 - 1277/78. Start 1245 CE; end 1277 CE to 1278 CE. Iranica: poisoned early 1278; Wikipedia 1277. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 252, § 89: A.H. 643 = 29 May 1245–17 May 1246 CE (Julian, tabular); ended A.H. 677 = 25 May 1278–14 May 1279 CE (Julian, tabular). Printed A.D. year(s): 1245–1278. Zambaur 1927, § 244 pp. 256–257: A.H. 643 = 29 May 1245–17 May 1246 CE (Julian, tabular); ended A.H. 684 = 9 March 1285–25 February 1286 CE (Julian, tabular). Died 684. No printed no. 2; the coregent sits under no. 1. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
