note: "Reign as given: 1328/29–1329/30. Start 1328 CE to 1329 CE; end 1329 CE to 1330 CE. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 252, § 89: A.H. 729 = 5 November 1328–24 October 1329 CE (Julian, tabular); ended A.H. 730 = 25 October 1329–13 October 1330 CE (Julian, tabular). Printed A.D. year(s): 1328–1329. Zambaur 1927, § 244 pp. 256–257: A.H. 729 = 5 November 1328–24 October 1329 CE (Julian, tabular); ended A.H. 730 = 25 October 1329–13 October 1330 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
