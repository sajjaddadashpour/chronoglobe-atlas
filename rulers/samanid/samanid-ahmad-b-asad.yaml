note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 819 CE to 820 CE; end 864 CE to 865 CE. Zambaur 1927, § 190 p. 202: A.H. 204 = 28 June 819–15 June 820 CE (Julian, tabular); ended A.H. 250 = 13 February 864–31 January 865 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
