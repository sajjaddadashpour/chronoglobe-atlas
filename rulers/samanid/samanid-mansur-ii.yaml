note: "Reign as given: July/August 997 – 1 February 999. Start 997 CE; end 999 CE. The Wikipedia row cites: Ross 1977 p. 480. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 132: A.H. 387 = 14 January 997–3 January 998 CE (Julian, tabular); ended A.H. 389 = 23 December 998–11 December 999 CE (Julian, tabular). Printed A.D. year(s): 997–999. Zambaur 1927, § 190 p. 202: Rajab 387 = 10 July 997–8 August 997 CE (Julian); ended 1 February 999 CE (Julian; A.H. 11 Safar 389). Blinded and dethroned 11 Safar 389. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
