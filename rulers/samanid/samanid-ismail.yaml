note: "Reign as given: August/September 892 – 24 November 907. Start 892 CE; end 907 CE. Formal accession 892 (Iranica Khorasan vi). The Wikipedia row cites: Ross 1977 p. 480. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 132: A.H. 279 = 3 April 892–22 March 893 CE (Julian, tabular); ended A.H. 295 = 12 October 907–30 September 908 CE (Julian, tabular). Printed A.D. year(s): 892–907. Zambaur 1927, § 190 p. 202: Jumada II 279 = 29 August 892–26 September 892 CE (Julian); ended Safar 295 = 11 November 907–9 December 907 CE (Julian). Governor of Bukhara 260-279; died 14 Safar 295. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
