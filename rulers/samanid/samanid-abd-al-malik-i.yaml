note: "Reign as given: 954/955–961/962. Start 954 CE to 955 CE; end 961 CE to 962 CE. The Wikipedia row cites: Ross 1977 p. 480. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 132: A.H. 343 = 7 May 954–25 April 955 CE (Julian, tabular); ended A.H. 350 = 20 February 961–8 February 962 CE (Julian, tabular). Printed A.D. year(s): 954–961. Zambaur 1927, § 190 p. 202: A.H. 343 = 7 May 954–25 April 955 CE (Julian, tabular); ended A.H. 350 = 20 February 961–8 February 962 CE (Julian, tabular). Died 350 at polo. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
