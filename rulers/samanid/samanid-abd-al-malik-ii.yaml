note: "Reign as given: Feb 999 - 999/1000. Start 999 CE; end 999 CE to 1000 CE. Iranica 999-1000. The Wikipedia row cites: Ross 1977 p. 480; Daryaee 2012 p. 395. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 132: A.H. 389 = 23 December 998–11 December 999 CE (Julian, tabular); end year not printed. Printed A.D. year(s): 999. Lane-Poole prints only the accession year 389/999; the table then ends. Zambaur 1927, § 190 p. 202: Safar 389 = 22 January 999–19 February 999 CE (Julian); ended 23 October 999 CE (Julian; A.H. 10 Dhu l-Qa'da 389). Captured 10 Dhu l-Qa'da 389 by the Ilek-Khan. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
