note: "Reign as given: 976/977 – 22 July 997. Start 976 CE to 977 CE; end 997 CE. The Wikipedia row cites: Ross 1977 p. 480. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 132: A.H. 366 = 30 August 976–19 August 977 CE (Julian, tabular); ended A.H. 387 = 14 January 997–3 January 998 CE (Julian, tabular). Printed A.D. year(s): 976–997. Zambaur 1927, § 190 p. 202: A.H. 366 = 30 August 976–19 August 977 CE (Julian, tabular); ended 22 July 997 CE (Julian; A.H. 13 Rajab 387). Died 13 Rajab 387. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
