note: "Reign as given: November/December 907 – 24 January 914. Start 907 CE; end 914 CE. The Wikipedia row cites: Ross 1977 p. 480. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 132: A.H. 295 = 12 October 907–30 September 908 CE (Julian, tabular); ended A.H. 301 = 7 August 913–26 July 914 CE (Julian, tabular). Printed A.D. year(s): 907–913. Zambaur 1927, § 190 p. 202: Safar 295 = 11 November 907–9 December 907 CE (Julian); ended 24 January 914 CE (Julian; A.H. 23 Jumada II 301). Assassinated 23 Jumada II 301. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
