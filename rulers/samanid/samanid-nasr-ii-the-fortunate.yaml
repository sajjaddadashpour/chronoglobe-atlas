note: "Reign as given: January 914 – March/April 943. Start 914 CE; end 943 CE. The Wikipedia row cites: Ross 1977 p. 480. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 132: A.H. 301 = 7 August 913–26 July 914 CE (Julian, tabular); ended A.H. 331 = 15 September 942–3 September 943 CE (Julian, tabular). Printed A.D. year(s): 913–942. Zambaur 1927, § 190 p. 202: Jumada II 301 = 2 January 914–30 January 914 CE (Julian); ended Rajab 331 = 11 March 943–9 April 943 CE (Julian). Died Rajab 331. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
