note: "Reign as given: 14 October 1092 – 1093. Start 1092 CE; end 1093 CE. The Wikipedia row cites: Luther 2001 p. 64; Daryaee 2012 pp. 395–396. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 153 (A. Great Seljuks): A.H. 485 = 12 February 1092–30 January 1093 CE (Julian, tabular); ended A.H. 487 = 21 January 1094–9 January 1095 CE (Julian, tabular). Printed A.D. year(s): 1092–1094. Zambaur 1927, § 210 p. 221: 18 November 1092 CE (Julian; A.H. 15 Shawwal 485); ended A.H. 487 = 21 January 1094–9 January 1095 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
