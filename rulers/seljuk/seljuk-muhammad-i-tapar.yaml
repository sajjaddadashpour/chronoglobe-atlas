note: "Reign as given: February/March 1105 – 5 August 1118. Start 1105 CE; end 1118 CE. The Wikipedia row cites: Luther 2001 p. 71; Venning & 2023b  Saljuk Sultanate. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 153 (A. Great Seljuks): A.H. 498 = 23 September 1104–11 September 1105 CE (Julian, tabular); ended A.H. 511 = 5 May 1117–23 April 1118 CE (Julian, tabular). Printed A.D. year(s): 1104–1117. Zambaur 1927, § 210 p. 221: 10 February 1105 CE (Julian; A.H. 23 Jumada I 498); ended 18 April 1118 CE (Julian; A.H. 24 Dhu l-Hijja 511) Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
