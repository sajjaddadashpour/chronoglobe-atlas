note: "Reign as given: January/February 1176 – 1194. Start 1176 CE; end 1194 CE. Iranica Khwarazmshahs iii: r. 1176-94, killed by Tekeš 590/1194. The Wikipedia row cites: Luther 2001 p. 150; Ross 1977 p. 307. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 154 (D. Seljuks of Iraq and Kurdistan): A.H. 573 = 30 June 1177–19 June 1178 CE (Julian, tabular); ended A.H. 590 = 27 December 1193–15 December 1194 CE (Julian, tabular). Printed A.D. year(s): 1177–1194. Printed as Ṭughril II. Lane-Poole's Tughril II of Iraq and Kurdistan is the atlas record Tughril III (already cited to Iranica). The table closes at A.H. 590 / A.D. 1194, labelled [*Shāhs of Khwārizm*]. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
