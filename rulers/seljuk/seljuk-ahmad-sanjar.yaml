note: "Reign as given: 1118 – 8 May 1157. Start 1118 CE; end 1157 CE. Role: supreme sultan (east, Merv). The Wikipedia row cites: Christie 2020 Dynastic Tables and Genealogies; Luther 2001 p. 101. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 153 (A. Great Seljuks): A.H. 511 = 5 May 1117–23 April 1118 CE (Julian, tabular); ended A.H. 552 = 13 February 1157–1 February 1158 CE (Julian, tabular). Printed A.D. year(s): 1117–1157. Zambaur 1927, § 210 p. 221: 18 April 1118 CE (Julian; A.H. 24 Dhu l-Hijja 511); end year not printed. The Great Seljuk list ends with Sanjar; no closing year is printed on this leaf. Lane-Poole closes the dynasty at 552/1157. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
