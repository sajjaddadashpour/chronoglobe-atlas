note: "Reign as given: 22 December 1104 – February/March 1105. Start 1104 CE; end 1105 CE. The Wikipedia row cites: Luther 2001 p. 71. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 153 (A. Great Seljuks): A.H. 498 = 23 September 1104–11 September 1105 CE (Julian, tabular); ended A.H. 498 = 23 September 1104–11 September 1105 CE (Julian, tabular). Printed A.D. year(s): 1104–1104. Zambaur 1927, § 210 p. 221: 23 December 1104 CE (Julian; A.H. 3 Rabi' II 498); ended 10 February 1105 CE (Julian; A.H. 23 Jumada I 498). Born 498; deposed by Muhammad b. Malik Shah 23 Jumada I 498. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
