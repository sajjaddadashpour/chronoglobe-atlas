note: "Reign as given: 5 August 1118 – 11 September 1131. Start 1118 CE; end 1131 CE. The Wikipedia row cites: Venning & 2023b  Saljuk Sultanate; Luther 2001 p. 101. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 154 (D. Seljuks of Iraq and Kurdistan): A.H. 511 = 5 May 1117–23 April 1118 CE (Julian, tabular); ended A.H. 525 = 4 December 1130–22 November 1131 CE (Julian, tabular). Printed A.D. year(s): 1117–1131. Printed as Mughīth-al-dīn Maḥmūd. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
