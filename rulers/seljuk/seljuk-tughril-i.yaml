note: "Reign as given: June/July 1038 – 4 September 1063. Start 1038 CE; end 1063 CE. The Wikipedia row cites: Luther 2001 p. 37; Venning & 2023b  Saljuk Sultanate. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 153 (A. Great Seljuks): A.H. 429 = 14 October 1037–2 October 1038 CE (Julian, tabular); ended A.H. 455 = 4 January 1063–23 December 1063 CE (Julian, tabular). Printed A.D. year(s): 1037–1063. Zambaur 1927, § 210 p. 221: A.H. 429 = 14 October 1037–2 October 1038 CE (Julian, tabular); ended 4 September 1063 CE (Julian; A.H. 8 Ramadan 455) Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
