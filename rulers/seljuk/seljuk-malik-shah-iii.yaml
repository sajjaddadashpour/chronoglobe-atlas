note: "Reign as given: October 1152 – December 1152/January 1153. Start 1152 CE; end 1152 CE to 1153 CE. The Wikipedia row cites: Luther 2001 p. 121. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 154 (D. Seljuks of Iraq and Kurdistan): A.H. 547 = 8 April 1152–27 March 1153 CE (Julian, tabular); ended A.H. 548 = 29 March 1153–18 March 1154 CE (Julian, tabular). Printed A.D. year(s): 1152–1153. Printed as Mu'īn-al-dīn Malik Shāh. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
