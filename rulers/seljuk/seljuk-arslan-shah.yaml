note: "Reign as given: September/October 1160 – January/February 1176. Start 1160 CE; end 1176 CE. The Wikipedia row cites: Luther 2001 p. 136; Luther 2001 p. 150. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 154 (D. Seljuks of Iraq and Kurdistan): A.H. 556 = 31 December 1160–19 December 1161 CE (Julian, tabular); ended A.H. 573 = 30 June 1177–19 June 1178 CE (Julian, tabular). Printed A.D. year(s): 1161–1177. Printed as Arslān Shāh. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
