note: "Reign as given: December 1132/January 1133. Start 1132 CE to 1133 CE; end 1132 CE to 1133 CE. The Wikipedia row cites: Luther 2001 p. 102. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 154 (D. Seljuks of Iraq and Kurdistan): A.H. 525 = 4 December 1130–22 November 1131 CE (Julian, tabular); ended A.H. 526 = 23 November 1131–10 November 1132 CE (Julian, tabular). Printed A.D. year(s): 1131–1132. Printed as Ghiyāth-al-dīn Dāwūd. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
