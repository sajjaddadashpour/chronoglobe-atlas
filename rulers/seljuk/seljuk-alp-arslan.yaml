note: "Reign as given: 4 September 1063 – 15 December 1072. Start 1063 CE; end 1072 CE. The Wikipedia row cites: Venning & 2023b  Saljuk Sultanate. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 153 (A. Great Seljuks): A.H. 455 = 4 January 1063–23 December 1063 CE (Julian, tabular); ended A.H. 465 = 17 September 1072–5 September 1073 CE (Julian, tabular). Printed A.D. year(s): 1063–1072. Zambaur 1927, § 210 p. 221: 4 September 1063 CE (Julian; A.H. 8 Ramadan 455); ended 24 November 1072 CE (Julian; A.H. 10 Rabi' I 465) Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
