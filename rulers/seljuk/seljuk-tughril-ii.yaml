note: "Reign as given: December 1132/January 1133 – October/November 1134. Start 1132 CE to 1133 CE; end 1134 CE. The Wikipedia row cites: Luther 2001 p. 121. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 154 (D. Seljuks of Iraq and Kurdistan): A.H. 526 = 23 November 1131–10 November 1132 CE (Julian, tabular); ended A.H. 527 = 12 November 1132–1 November 1133 CE (Julian, tabular). Printed A.D. year(s): 1132–1133. Printed as Ṭughril I. Lane-Poole numbers this line separately from the Great Seljuks; his Tughril I of Iraq and Kurdistan is the atlas record Tughril II. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
