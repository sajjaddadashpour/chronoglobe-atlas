note: "Reign as given: 15 December 1072 – 14 October 1092. Start 1072 CE; end 1092 CE. The Wikipedia row cites: Venning & 2023b  Saljuk Sultanate; Luther 2001 p. 64. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 153 (A. Great Seljuks): A.H. 465 = 17 September 1072–5 September 1073 CE (Julian, tabular); ended A.H. 485 = 12 February 1092–30 January 1093 CE (Julian, tabular). Printed A.D. year(s): 1072–1092. Zambaur 1927, § 210 p. 221: 24 November 1072 CE (Julian; A.H. 10 Rabi' I 465); ended 18 November 1092 CE (Julian; A.H. 15 Shawwal 485). Died 15 Shawwal 485. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
