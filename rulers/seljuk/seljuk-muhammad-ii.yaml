note: "Reign as given: December 1152/January 1153 – December 1159/January 1160. Start 1152 CE to 1153 CE; end 1159 CE to 1160 CE. The Wikipedia row cites: Luther 2001 p. 140; Luther 2001 p. 132. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 154 (D. Seljuks of Iraq and Kurdistan): A.H. 548 = 29 March 1153–18 March 1154 CE (Julian, tabular); ended A.H. 554 = 23 January 1159–12 January 1160 CE (Julian, tabular). Printed A.D. year(s): 1153–1159. Printed as Moḥammad. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
