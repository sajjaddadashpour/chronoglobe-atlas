note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 1387 CE to 1388 CE; end 1392 CE to 1393 CE. Lane-Poole 1894, p. 250: A.H. 789 = 22 January 1387–10 January 1388 CE (Julian, tabular); ended A.H. 795 = 17 November 1392–5 November 1393 CE (Julian, tabular). Printed A.D. year(s): 1387–1393. Printed as contemporaries, 789-795 / 1387-1393. Zambaur 1927, § 239 p. 254: A.H. 789 = 22 January 1387–10 January 1388 CE (Julian, tabular); ended A.H. 795 = 17 November 1392–5 November 1393 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
