note: "Reign as given: 1314–1359. Start 1314 CE; end 1359 CE. Coins at Kerman 1340-41; took Shiraz 1353; blinded by his sons 760/1359. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 250, § 87: A.H. 713 = 28 April 1313–16 April 1314 CE (Julian, tabular); ended A.H. 759 = 14 December 1357–2 December 1358 CE (Julian, tabular). Printed A.D. year(s): 1313–1357. Zambaur 1927, § 239 p. 254: Dhu l-Qa'da 713 = 17 February 1314–18 March 1314 CE (Julian); ended Ramadan 759 = 7 August 1358–5 September 1358 CE (Julian) Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
