note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 1358 CE; end 1374 CE. Zambaur 1927, § 239 p. 254: Ramadan 759 = 7 August 1358–5 September 1358 CE (Julian); ended 8 September 1374 CE (Julian; A.H. 30 Rabi' I 776). At Isfahan, until 776. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
