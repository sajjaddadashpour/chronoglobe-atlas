note: "Reign as given: 1384 - ?. Start 1384 CE; end unknown. End year unknown; latest is the polity end bound (1393 CE), not a reign date. Designated by Shah Šojāʿ. End not extracted (open question). [Iran pass 2: that unknown bound has now been filled from Lane-Poole and/or Zambaur; earliest/latest are no longer the polity placeholder.] Evidence: scholarly-or-primary. Lane-Poole 1894, p. 250, § 87: A.H. 786 = 24 February 1384–12 February 1385 CE (Julian, tabular); ended A.H. 789 = 22 January 1387–10 January 1388 CE (Julian, tabular). Printed A.D. year(s): 1384–1387. Zambaur 1927, § 239 p. 254: Sha'ban 786 = 18 September 1384–16 October 1384 CE (Julian); ended A.H. 789 = 22 January 1387–10 January 1388 CE (Julian, tabular). Dethroned by Timur in 789. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
