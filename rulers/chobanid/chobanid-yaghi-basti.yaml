note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 1343 CE to 1344 CE; end 1344 CE to 1345 CE. Zambaur 1927, § 241 p. 255: A.H. 744 = 26 May 1343–13 May 1344 CE (Julian, tabular); ended A.H. 745 = 15 May 1344–4 May 1345 CE (Julian, tabular). Had Jalal al-Din Mas'ud Inju killed in 743; assassinated by his brother in 745. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
