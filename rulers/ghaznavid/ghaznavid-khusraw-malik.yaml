note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 1160 CE; end 1186 CE to 1187 CE. Lane-Poole 1894, p. 289: A.H. 555 = 12 January 1160–30 December 1160 CE (Julian, tabular); ended A.H. 582 = 24 March 1186–12 March 1187 CE (Julian, tabular). Printed A.D. year(s): 1160–1186. Zambaur 1927, § 260 p. 282: A.H. 555 = 12 January 1160–30 December 1160 CE (Julian, tabular); ended A.H. 582 = 24 March 1186–12 March 1187 CE (Julian, tabular). Lord of the Punjab; executed 587. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
