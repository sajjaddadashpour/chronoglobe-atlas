note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 1059 CE to 1060 CE; end 1098 CE to 1099 CE. Lane-Poole 1894, p. 289: A.H. 451 = 17 February 1059–5 February 1060 CE (Julian, tabular); ended A.H. 492 = 28 November 1098–16 November 1099 CE (Julian, tabular). Printed A.D. year(s): 1059–1099. Zambaur 1927, § 260 p. 282: A.H. 451 = 17 February 1059–5 February 1060 CE (Julian, tabular); ended A.H. 492 = 28 November 1098–16 November 1099 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
