note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 1049 CE to 1050 CE; end 1052 CE to 1053 CE. Lane-Poole 1894, p. 289: A.H. 440 = 16 June 1048–4 June 1049 CE (Julian, tabular); ended A.H. 444 = 3 May 1052–21 April 1053 CE (Julian, tabular). Printed A.D. year(s): 1049–1052. Zambaur 1927, § 260 p. 282: A.H. 441 = 5 June 1049–24 May 1050 CE (Julian, tabular); ended 24 January 1053 CE (Julian; A.H. 1 Shawwal 444) Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
