note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 1118 CE; end 1152 CE to 1153 CE. Lane-Poole 1894, p. 289: A.H. 512 = 24 April 1118–12 April 1119 CE (Julian, tabular); ended A.H. 547 = 8 April 1152–27 March 1153 CE (Julian, tabular). Printed A.D. year(s): 1118–1152. Zambaur 1927, § 260 p. 282: Jumada I 512 = 20 August 1118–18 September 1118 CE (Julian); ended A.H. 547 = 8 April 1152–27 March 1153 CE (Julian, tabular). Vassal of Sanjar. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
