note: "Reign as given: 1030 – 23 May 1040. Start 1030 CE; end 1040 CE. Defeated at Dandānqān 1040; Iran-relevant list ends here. Later Ghaznavid sultans (to 1186) not imported. The Wikipedia row cites: Ross 1977 p. 230. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 289: A.H. 421 = 9 January 1030–28 December 1030 CE (Julian, tabular); ended A.H. 432 = 11 September 1040–30 August 1041 CE (Julian, tabular). Printed A.D. year(s): 1030–1040. Zambaur 1927, § 260 p. 282: Shawwal 421 = 2 October 1030–30 October 1030 CE (Julian); ended 6 January 1042 CE (Julian; A.H. 11 Jumada I 433). Official accession at Herat in Dhu l-Qa'da 421. Assassinated 11 Jumada I 433. A second reign of Muhammad in 432, defeated and killed in 433, sits between Mas'ud I and Mawdud. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
