note: "Reign as given: 997/998–998. Start 997 CE to 998 CE; end 998 CE. The Wikipedia row cites: Ross 1977 p. 230. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 289: A.H. 387 = 14 January 997–3 January 998 CE (Julian, tabular); ended A.H. 388 = 3 January 998–22 December 998 CE (Julian, tabular). Printed A.D. year(s): 997–998. Zambaur 1927, § 260 p. 282: A.H. 387 = 14 January 997–3 January 998 CE (Julian, tabular); ended A.H. 389 = 23 December 998–11 December 999 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
