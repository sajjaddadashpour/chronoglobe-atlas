note: "Reign as given: 977/978–997/998. Start 977 CE to 978 CE; end 997 CE to 998 CE. The Wikipedia row cites: Ross 1977 p. 230. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 289: A.H. 366 = 30 August 976–19 August 977 CE (Julian, tabular); ended A.H. 387 = 14 January 997–3 January 998 CE (Julian, tabular). Printed A.D. year(s): 976–997. Zambaur 1927, § 260 p. 282: A.H. 367 = 19 August 977–7 August 978 CE (Julian, tabular); ended A.H. 387 = 14 January 997–3 January 998 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
