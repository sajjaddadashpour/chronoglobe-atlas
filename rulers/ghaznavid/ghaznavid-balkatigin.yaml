note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 965 CE to 966 CE; end 972 CE to 973 CE. Lane-Poole 1894, p. 289: A.H. 355 = 28 December 965–17 December 966 CE (Julian, tabular); ended A.H. 362 = 12 October 972–30 September 973 CE (Julian, tabular). Printed A.D. year(s): 966–972. Zambaur 1927, § 260 p. 282: A.H. 355 = 28 December 965–17 December 966 CE (Julian, tabular); ended A.H. 362 = 12 October 972–30 September 973 CE (Julian, tabular). Governor of Balkh from 324. Nos. 3-5 braced as slaves of Alptigin. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
