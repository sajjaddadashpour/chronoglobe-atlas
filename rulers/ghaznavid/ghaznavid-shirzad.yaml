note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 1114 CE to 1115 CE; end 1115 CE to 1116 CE. Lane-Poole 1894, p. 289: A.H. 508 = 7 June 1114–26 May 1115 CE (Julian, tabular); ended A.H. 509 = 27 May 1115–14 May 1116 CE (Julian, tabular). Printed A.D. year(s): 1114–1115. Zambaur 1927, § 260 p. 282: A.H. 508 = 7 June 1114–26 May 1115 CE (Julian, tabular); ended A.H. 509 = 27 May 1115–14 May 1116 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
