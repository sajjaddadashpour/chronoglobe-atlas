note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 972 CE to 973 CE; end 976 CE to 978 CE. Lane-Poole 1894, p. 289: A.H. 362 = 12 October 972–30 September 973 CE (Julian, tabular); ended A.H. 366 = 30 August 976–19 August 977 CE (Julian, tabular). Printed A.D. year(s): 972–976. Zambaur 1927, § 260 p. 282: A.H. 362 = 12 October 972–30 September 973 CE (Julian, tabular); ended A.H. 367 = 19 August 977–7 August 978 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
