note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 1098 CE to 1099 CE; end 1114 CE to 1115 CE. Lane-Poole 1894, p. 289: A.H. 492 = 28 November 1098–16 November 1099 CE (Julian, tabular); ended A.H. 508 = 7 June 1114–26 May 1115 CE (Julian, tabular). Printed A.D. year(s): 1099–1114. Zambaur 1927, § 260 p. 282: A.H. 492 = 28 November 1098–16 November 1099 CE (Julian, tabular); ended A.H. 508 = 7 June 1114–26 May 1115 CE (Julian, tabular) (accession marked circa / environ / '?'). Zambaur prints a question mark before 492. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
