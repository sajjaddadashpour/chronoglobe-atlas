note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 962 CE to 963 CE; end 963 CE to 964 CE. Lane-Poole 1894, p. 289: A.H. 351 = 9 February 962–28 January 963 CE (Julian, tabular); ended A.H. 352 = 30 January 963–19 January 964 CE (Julian, tabular). Printed A.D. year(s): 962–963. Zambaur 1927, § 260 p. 282: A.H. 351 = 9 February 962–28 January 963 CE (Julian, tabular); ended A.H. 352 = 30 January 963–19 January 964 CE (Julian, tabular). Samanid Turkish slave; Dhu l-Hijja 349 governor of Khurasan; 344 governor of Herat. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
