note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 1052 CE to 1053 CE; end 1052 CE to 1053 CE. Lane-Poole 1894, p. 289: A.H. 444 = 3 May 1052–21 April 1053 CE (Julian, tabular); ended A.H. 444 = 3 May 1052–21 April 1053 CE (Julian, tabular). Printed A.D. year(s): 1052–1052. Zambaur 1927, § 260 p. 282: 24 January 1053 CE (Julian; A.H. 1 Shawwal 444); ended A.H. 444 = 3 May 1052–21 April 1053 CE (Julian, tabular). Mahmud's slave; usurper for forty days. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
