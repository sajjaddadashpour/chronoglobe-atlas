note: "Reign as given: 998 – 30 April 1030. Start 998 CE; end 1030 CE. The Wikipedia row cites: Ross 1977 p. 230. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 289: A.H. 388 = 3 January 998–22 December 998 CE (Julian, tabular); ended A.H. 421 = 9 January 1030–28 December 1030 CE (Julian, tabular). Printed A.D. year(s): 998–1030. Zambaur 1927, § 260 p. 282: A.H. 389 = 23 December 998–11 December 999 CE (Julian, tabular); ended 18 February 1030 CE (Julian; A.H. 11 Safar 421). Died 11 Safar 421. As governor of Khurasan 384-387 he used the laqab Sayf al-Dawla. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
