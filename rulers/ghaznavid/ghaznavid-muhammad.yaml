note: "Reign as given: 1030. Start 1030 CE; end 1030 CE. The Wikipedia row cites: Ross 1977 p. 230. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 289: A.H. 421 = 9 January 1030–28 December 1030 CE (Julian, tabular); ended A.H. 421 = 9 January 1030–28 December 1030 CE (Julian, tabular). Printed A.D. year(s): 1030–1030. Zambaur 1927, § 260 p. 282: Safar 421 = 8 February 1030–8 March 1030 CE (Julian); ended Shawwal 421 = 2 October 1030–30 October 1030 CE (Julian). Blinded by his twin Mas'ud in 421. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
