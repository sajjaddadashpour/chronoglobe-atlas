note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 963 CE to 964 CE; end 965 CE to 966 CE. Lane-Poole 1894, p. 289: A.H. 352 = 30 January 963–19 January 964 CE (Julian, tabular); ended A.H. 355 = 28 December 965–17 December 966 CE (Julian, tabular). Printed A.D. year(s): 963–966. Zambaur 1927, § 260 p. 282: A.H. 352 = 30 January 963–19 January 964 CE (Julian, tabular); ended A.H. 355 = 28 December 965–17 December 966 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
