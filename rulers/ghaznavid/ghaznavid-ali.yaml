note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 1048 CE to 1049 CE; end 1049 CE to 1050 CE. Lane-Poole 1894, p. 289: A.H. 440 = 16 June 1048–4 June 1049 CE (Julian, tabular); ended A.H. 440 = 16 June 1048–4 June 1049 CE (Julian, tabular). Printed A.D. year(s): 1048–1049. Zambaur 1927, § 260 p. 282: Rajab 440 = 10 December 1048–8 January 1049 CE (Julian); ended A.H. 441 = 5 June 1049–24 May 1050 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
