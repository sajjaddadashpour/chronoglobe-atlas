note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 1493 CE to 1494 CE; end 1494 CE to 1495 CE. Lane-Poole 1894, p. 268: A.H. 899 = 12 October 1493–30 September 1494 CE (Julian, tabular); ended A.H. 900 = 2 October 1494–21 September 1495 CE (Julian, tabular). Printed A.D. year(s): 1493–1494. The next table row is 'Anarchy' at 900/1494; the dynasty closes at 906/1500. Zambaur 1927, § 251 p. 269 (supreme line): A.H. 899 = 12 October 1493–30 September 1494 CE (Julian, tabular); ended A.H. 900 = 2 October 1494–21 September 1495 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
