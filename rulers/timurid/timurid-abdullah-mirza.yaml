note: "Reign as given: May 1450 – 1451/1452. Start 1450 CE; end 1451 CE to 1452 CE. The Wikipedia row cites: Ross 1977 p. 536. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 268: A.H. 854 = 14 February 1450–3 February 1451 CE (Julian, tabular); ended A.H. 855 = 3 February 1451–22 January 1452 CE (Julian, tabular). Printed A.D. year(s): 1450–1452. Zambaur 1927, § 251 p. 269 (supreme line): Rabi' I 854 = 14 April 1450–13 May 1450 CE (Julian); ended A.H. 855 = 3 February 1451–22 January 1452 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
