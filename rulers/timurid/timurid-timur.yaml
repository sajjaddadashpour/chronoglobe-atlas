note: "Reign as given: 9 April 1370 – 18 February 1405. Start 1370 CE; end 1405 CE. The Wikipedia row cites: Ross 1977 p. 536. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 268: A.H. 771 = 5 August 1369–24 July 1370 CE (Julian, tabular); ended A.H. 807 = 10 July 1404–29 June 1405 CE (Julian, tabular). Printed A.D. year(s): 1369–1404. Zambaur 1927, § 251 p. 269 (supreme line): 9 April 1370 CE (Julian; A.H. 12 Ramadan 771); ended A.H. 807 = 10 July 1404–29 June 1405 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
