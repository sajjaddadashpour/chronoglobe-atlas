note: "Reign as given: 1446/1447 – October/November 1449. Start 1446 CE to 1447 CE; end 1449 CE. The Wikipedia row cites: Ross 1977 p. 536. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 268: A.H. 850 = 29 March 1446–17 March 1447 CE (Julian, tabular); ended A.H. 853 = 24 February 1449–12 February 1450 CE (Julian, tabular). Printed A.D. year(s): 1447–1449. Zambaur 1927, § 251 p. 269 (supreme line): A.H. 850 = 29 March 1446–17 March 1447 CE (Julian, tabular); ended Ramadan 853 = 18 October 1449–16 November 1449 CE (Julian). Killed in Ramadan 853 by his son Abd al-Latif. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
