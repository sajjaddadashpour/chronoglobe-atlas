note: "Reign as given: February 1405 – 1409/1410. Start 1405 CE; end 1409 CE to 1410 CE. The Wikipedia row cites: Venning & 2023b  Timurid Dynasty; Ross 1977 p. 536. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 268: A.H. 807 = 10 July 1404–29 June 1405 CE (Julian, tabular); ended A.H. 812 = 16 May 1409–4 May 1410 CE (Julian, tabular). Printed A.D. year(s): 1404–1409. Printed 807-12 / 1404-9, overlapping Shah Rukh (807/1404). Zambaur 1927, § 251 p. 269 (supreme line): A.H. 807 = 10 July 1404–29 June 1405 CE (Julian, tabular); ended A.H. 812 = 16 May 1409–4 May 1410 CE (Julian, tabular). Until 812. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
