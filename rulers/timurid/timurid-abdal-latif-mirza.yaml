note: "Reign as given: October/November 1449 – May 1450. Start 1449 CE; end 1450 CE. The Wikipedia row cites: Ross 1977 p. 536. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 268: A.H. 853 = 24 February 1449–12 February 1450 CE (Julian, tabular); ended A.H. 854 = 14 February 1450–3 February 1451 CE (Julian, tabular). Printed A.D. year(s): 1449–1450. Zambaur 1927, § 251 p. 269 (supreme line): Ramadan 853 = 18 October 1449–16 November 1449 CE (Julian); ended Rabi' I 854 = 14 April 1450–13 May 1450 CE (Julian). Assassinated in Rabi' I 854. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
