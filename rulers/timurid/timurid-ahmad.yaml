note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 1467 CE to 1468 CE; end 1493 CE to 1494 CE. Lane-Poole 1894, p. 268: A.H. 872 = 2 August 1467–20 July 1468 CE (Julian, tabular); ended A.H. 899 = 12 October 1493–30 September 1494 CE (Julian, tabular). Printed A.D. year(s): 1467–1493. Zambaur 1927, § 251 p. 269 (supreme line): A.H. 872 = 2 August 1467–20 July 1468 CE (Julian, tabular); ended A.H. 899 = 12 October 1493–30 September 1494 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
