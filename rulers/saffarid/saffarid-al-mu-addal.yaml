note: "Reign as given: 911. Start 911 CE; end 911 CE. The Wikipedia row cites: Bosworth 2010. Evidence: scholarly-or-primary. Zambaur 1927, § 189 pp. 199–200 (1st and 2nd dynasties): A.H. 299 = 29 August 911–16 August 912 CE (Julian, tabular); ended A.H. 300 = 18 August 912–7 August 913 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
