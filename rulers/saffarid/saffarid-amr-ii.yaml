note: "Reign as given: 912–913. Start 912 CE; end 913 CE. The Wikipedia row cites: Daryaee 2012 p. 394. Evidence: scholarly-or-primary. Zambaur 1927, § 189 pp. 199–200 (1st and 2nd dynasties): A.H. 300 = 18 August 912–7 August 913 CE (Julian, tabular); ended A.H. 300 = 18 August 912–7 August 913 CE (Julian, tabular). The next printed name is Abu Ja'far Ahmad at circa 320; no end year is given for this Amr, so none is inferred from that later circa date. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
