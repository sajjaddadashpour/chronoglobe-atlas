note: "Reign as given: 963 - 1002/1003. Start 963 CE; end 1002 CE to 1003 CE. The Wikipedia row cites: Daryaee 2012 p. 394. Evidence: scholarly-or-primary. Zambaur 1927, § 189 pp. 199–200 (1st and 2nd dynasties): A.H. 344 = 27 April 955–15 April 956 CE (Julian, tabular); ended A.H. 399 = 5 September 1008–24 August 1009 CE (Julian, tabular) (accession marked circa / environ / '?'). Died 399. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
