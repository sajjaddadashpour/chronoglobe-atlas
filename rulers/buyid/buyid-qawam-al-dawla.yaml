note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 1012 CE to 1013 CE; end 1028 CE to 1029 CE. Lane-Poole 1894, p. 141 (Kirman): A.H. 403 = 23 July 1012–11 July 1013 CE (Julian, tabular); ended A.H. 419 = 31 January 1028–18 January 1029 CE (Julian, tabular). Printed A.D. year(s): 1012–1028. Zambaur 1927, § 204 p. 213 (Kirman): A.H. 403 = 23 July 1012–11 July 1013 CE (Julian, tabular); ended A.H. 419 = 31 January 1028–18 January 1029 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
