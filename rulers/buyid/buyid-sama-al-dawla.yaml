method: low and high are the outer year bounds of the reign as dated (approximately) by the cited sources; inner bounds are in note.
note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 1021 CE to 1022 CE; end 1022 CE to 1023 CE. Zambaur 1927, § 204 p. 213 (Hamadan / Isfahan / Rayy): A.H. 412 = 17 April 1021–6 April 1022 CE (Julian, tabular); ended A.H. 413 = 6 April 1022–25 March 1023 CE (Julian, tabular). Zambaur prints Samsamaddaula Abu-l-Hasan at 412, then Kakuyids at Isfahan 412 and Hamadan 413. Lane-Poole has Sama al-Dawla Abu l-Hasan, c. 412-414. Lane-Poole 1894, p. 142: A.H. 412 = 17 April 1021–6 April 1022 CE (Julian, tabular); ended A.H. 414 = 26 March 1023–13 March 1024 CE (Julian, tabular). Printed A.D. year(s): 1021–1023 (accession marked circa / environ / '?'). Lane-Poole prints c. 412 / c. 1021; deposed by Ibn-Kakwayh; closes at 414/1023. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
