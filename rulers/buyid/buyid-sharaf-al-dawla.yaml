note: "Reign as given: March/April 983 – September/October 989. Start 983 CE; end 989 CE. Branch rulers overlap: the list mixes heads of the Fārs, Ray and Iraq branches. The Wikipedia row cites: Ross 1977 p. 111. Evidence: scholarly-or-primary. Lane-Poole 1894, pp. 141–142 (I. Fars): A.H. 372 = 26 June 982–14 June 983 CE (Julian, tabular); ended A.H. 379 = 11 April 989–31 March 990 CE (Julian, tabular). Printed A.D. year(s): 982–989. Zambaur 1927, § 204 p. 212 (Baghdad): Ramadan 376 = 4 January 987–2 February 987 CE (Julian); ended Jumada II 380 = 26 August 990–23 September 990 CE (Julian). Combined regional or interrupted dates from the same book: 987 to 989 (Zambaur § 204 p. 212 (Baghdad): A.H. 376–379; tabular Islamic calendar, Julian years) | 983 to 990 (Zambaur § 204 p. 213 (Fars and Khuzistan): A.H. 372–380; tabular Islamic calendar, Julian years) Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
