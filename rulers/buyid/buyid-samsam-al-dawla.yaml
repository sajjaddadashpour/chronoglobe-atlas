note: "Reign as given: 989–998. Start 989 CE; end 998 CE. Branch rulers overlap: the list mixes heads of the Fārs, Ray and Iraq branches. The Wikipedia row cites: Daryaee 2012 p. 394. Evidence: scholarly-or-primary. Lane-Poole 1894, pp. 141–142 (I. Fars): A.H. 379 = 11 April 989–31 March 990 CE (Julian, tabular); ended A.H. 388 = 3 January 998–22 December 998 CE (Julian, tabular). Printed A.D. year(s): 989–998. Zambaur 1927, § 204 p. 212 (Baghdad): Shawwal 372 = 19 March 983–16 April 983 CE (Julian); ended A.H. 388 = 3 January 998–22 December 998 CE (Julian, tabular). Combined regional or interrupted dates from the same book: 983 to 987 (Zambaur § 204 p. 212 (Baghdad): A.H. 372–376; tabular Islamic calendar, Julian years) | 990 to 998 (Zambaur § 204 p. 213 (Fars and Khuzistan): A.H. 380–388; tabular Islamic calendar, Julian years) | 982–983 to 998 (Zambaur § 204 p. 213 (Kirman): A.H. 372–388; tabular Islamic calendar, Julian years) Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
