note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 976 CE to 977 CE; end 997 CE to 998 CE. Lane-Poole 1894, p. 142 (Rayy; adding Ispahan 373): A.H. 366 = 30 August 976–19 August 977 CE (Julian, tabular); ended A.H. 387 = 14 January 997–3 January 998 CE (Julian, tabular). Printed A.D. year(s): 976–997. Zambaur 1927, § 204 p. 213 (Hamadan / Isfahan / Rayy): A.H. 373 = 15 June 983–2 June 984 CE (Julian, tabular); ended A.H. 387 = 14 January 997–3 January 998 CE (Julian, tabular). Combined regional or interrupted dates from the same book: 983–984 to 997 (Zambaur § 204 p. 213 (Hamadan / Isfahan / Rayy): A.H. 373–387; tabular Islamic calendar, Julian years) | 976–977 to 997–998 (Zambaur § 204 p. 213 (Rayy): A.H. 366–387; tabular Islamic calendar, Julian years) Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
