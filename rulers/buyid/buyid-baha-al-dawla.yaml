note: "Reign as given: 998–1012. Start 998 CE; end 1012 CE. Branch rulers overlap: the list mixes heads of the Fārs, Ray and Iraq branches. The Wikipedia row cites: Daryaee 2012 p. 394. Evidence: scholarly-or-primary. Lane-Poole 1894, pp. 141–142 (I. Fars): A.H. 388 = 3 January 998–22 December 998 CE (Julian, tabular); ended A.H. 403 = 23 July 1012–11 July 1013 CE (Julian, tabular). Printed A.D. year(s): 998–1012. Zambaur 1927, § 204 p. 212 (Baghdad): Jumada II 379 = 6 September 989–4 October 989 CE (Julian); ended A.H. 403 = 23 July 1012–11 July 1013 CE (Julian, tabular). Combined regional or interrupted dates from the same book: 989 to 1012–1013 (Zambaur § 204 p. 212 (Baghdad): A.H. 379–403; tabular Islamic calendar, Julian years) | 998 to 1012–1013 (Zambaur § 204 p. 213 (Fars and Khuzistan): A.H. 388–403; tabular Islamic calendar, Julian years) | 998 to 1012–1013 (Zambaur § 204 p. 213 (Kirman): A.H. 388–403; tabular Islamic calendar, Julian years) Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
