note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 1048 CE to 1049 CE; end 1055 CE to 1056 CE. Lane-Poole 1894, pp. 141–142 (I. Fars): A.H. 440 = 16 June 1048–4 June 1049 CE (Julian, tabular); ended A.H. 447 = 2 April 1055–21 March 1056 CE (Julian, tabular). Printed A.D. year(s): 1048–1055. Zambaur 1927, § 204 p. 212 (Baghdad): A.H. 440 = 16 June 1048–4 June 1049 CE (Julian, tabular); ended A.H. 447 = 2 April 1055–21 March 1056 CE (Julian, tabular). Combined regional or interrupted dates from the same book: 1048–1049 to 1055–1056 (Zambaur § 204 p. 212 (Baghdad): A.H. 440–447; tabular Islamic calendar, Julian years) | 1048–1049 to 1055–1056 (Zambaur § 204 p. 213 (Fars and Khuzistan): A.H. 440–447; tabular Islamic calendar, Julian years) Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
