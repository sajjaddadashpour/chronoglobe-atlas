note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 976 CE to 977 CE; end 983 CE to 984 CE. Lane-Poole 1894, p. 142 (Ispahan only): A.H. 366 = 30 August 976–19 August 977 CE (Julian, tabular); ended A.H. 373 = 15 June 983–2 June 984 CE (Julian, tabular). Printed A.D. year(s): 976–983. Zambaur 1927, § 204 p. 213 (Hamadan / Isfahan / Rayy): A.H. 366 = 30 August 976–19 August 977 CE (Julian, tabular); ended A.H. 373 = 15 June 983–2 June 984 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
