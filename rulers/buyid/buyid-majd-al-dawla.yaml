note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 997 CE to 998 CE; end 1029 CE to 1030 CE. Lane-Poole 1894, p. 142 (Rayy, Majd): A.H. 387 = 14 January 997–3 January 998 CE (Julian, tabular); ended A.H. 420 = 20 January 1029–9 January 1030 CE (Julian, tabular). Printed A.D. year(s): 997–1029. Zambaur 1927, § 204 p. 213 (Rayy): A.H. 387 = 14 January 997–3 January 998 CE (Julian, tabular); ended A.H. 420 = 20 January 1029–9 January 1030 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
