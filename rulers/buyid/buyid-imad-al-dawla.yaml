note: "Reign as given: 933/934–949/950. Start 933 CE to 934 CE; end 949 CE to 950 CE. Branch rulers overlap: the list mixes heads of the Fārs, Ray and Iraq branches. The Wikipedia row cites: Ross 1977 p. 111; Daryaee 2012 p. 394. Evidence: scholarly-or-primary. Lane-Poole 1894, pp. 141–142 (I. Fars): A.H. 320 = 13 January 932–31 December 932 CE (Julian, tabular); ended A.H. 338 = 1 July 949–20 June 950 CE (Julian, tabular). Printed A.D. year(s): 932–949. Zambaur 1927, § 204 pp. 212–213 (emirat supérieur / Djabal): A.H. 320 = 13 January 932–31 December 932 CE (Julian, tabular); ended A.H. 338 = 1 July 949–20 June 950 CE (Julian, tabular). Emirat supérieur 320-338; also Djabal from 320. Combined regional or interrupted dates from the same book: 932 to 949 (Zambaur § 204 pp. 212–213 (emirat supérieur / Djabal): A.H. 320–338; tabular Islamic calendar, Julian years) | 933–934 to 949–950 (Zambaur § 204 p. 213 (Fars and Khuzistan): A.H. 322–338; tabular Islamic calendar, Julian years) Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
