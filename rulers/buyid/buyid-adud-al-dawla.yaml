note: "Reign as given: 949/950 – 26 March 983. Start 949 CE to 950 CE; end 983 CE. Branch rulers overlap: the list mixes heads of the Fārs, Ray and Iraq branches. The Wikipedia row cites: Ross 1977 p. 111. Evidence: scholarly-or-primary. Lane-Poole 1894, pp. 141–142 (I. Fars): A.H. 338 = 1 July 949–20 June 950 CE (Julian, tabular); ended A.H. 372 = 26 June 982–14 June 983 CE (Julian, tabular). Printed A.D. year(s): 949–982. Zambaur 1927, § 204 p. 212 (Baghdad): 29 May 978 CE (Julian; A.H. 18 Shawwal 367); ended Shawwal 372 = 19 March 983–16 April 983 CE (Julian). Combined regional or interrupted dates from the same book: 978 to 983 (Zambaur § 204 p. 212 (Baghdad): A.H. 367–372; tabular Islamic calendar, Julian years) | 949–950 to 983 (Zambaur § 204 p. 213 (Fars and Khuzistan): A.H. 338–372; tabular Islamic calendar, Julian years) | 949–950 to 982–983 (Zambaur § 204 p. 213 (Kirman): A.H. 338–372; tabular Islamic calendar, Julian years) Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
