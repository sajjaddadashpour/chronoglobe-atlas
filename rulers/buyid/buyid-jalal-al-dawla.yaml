note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 1025 CE to 1026 CE; end 1043 CE to 1044 CE. Lane-Poole 1894, p. 141 (Iraq, divided): A.H. 416 = 4 March 1025–20 February 1026 CE (Julian, tabular); ended A.H. 435 = 10 August 1043–28 July 1044 CE (Julian, tabular). Printed A.D. year(s): 1025–1043. Zambaur 1927, § 204 p. 212 (Baghdad): A.H. 416 = 4 March 1025–20 February 1026 CE (Julian, tabular); ended 9 March 1044 CE (Julian; A.H. 6 Sha'ban 435). Died 6 Sha'ban 435. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
