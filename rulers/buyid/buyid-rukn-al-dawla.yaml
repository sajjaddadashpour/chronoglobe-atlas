note: "Reign as given: 946/947 – 16 September 976. Start 946 CE to 947 CE; end 976 CE. Branch rulers overlap: the list mixes heads of the Fārs, Ray and Iraq branches. The Wikipedia row cites: Ross 1977 p. 112; Daryaee 2012 p. 394. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 142 (III. Rayy, Hamadhan, Ispahan): A.H. 320 = 13 January 932–31 December 932 CE (Julian, tabular); ended A.H. 366 = 30 August 976–19 August 977 CE (Julian, tabular). Printed A.D. year(s): 932–976. Zambaur 1927, § 204 pp. 212–213 (emirat supérieur / Djabal): 11 November 949 CE (Julian; A.H. 16 Jumada I 338); ended A.H. 366 = 30 August 976–19 August 977 CE (Julian, tabular). Emirat supérieur 16 Jumada I 338-366; Djabal from 335 to 366. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
