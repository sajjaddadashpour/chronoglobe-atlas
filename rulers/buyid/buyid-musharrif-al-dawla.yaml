note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 1020 CE to 1022 CE; end 1025 CE to 1026 CE. Lane-Poole 1894, p. 141 (Iraq, divided): A.H. 411 = 27 April 1020–15 April 1021 CE (Julian, tabular); ended A.H. 416 = 4 March 1025–20 February 1026 CE (Julian, tabular). Printed A.D. year(s): 1020–1025. Zambaur 1927, § 204 p. 212 (Baghdad): A.H. 412 = 17 April 1021–6 April 1022 CE (Julian, tabular); ended A.H. 416 = 4 March 1025–20 February 1026 CE (Julian, tabular). Combined regional or interrupted dates from the same book: 1021–1022 to 1025–1026 (Zambaur § 204 p. 212 (Baghdad): A.H. 412–416; tabular Islamic calendar, Julian years) | 1021–1022 to 1024–1025 (Zambaur § 204 p. 213 (Fars and Khuzistan): A.H. 412–415; tabular Islamic calendar, Julian years) Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
