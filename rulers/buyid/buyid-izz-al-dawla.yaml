note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 967 CE; end 977 CE to 978 CE. Lane-Poole 1894, p. 141 (II. Iraq): A.H. 356 = 17 December 966–5 December 967 CE (Julian, tabular); ended A.H. 367 = 19 August 977–7 August 978 CE (Julian, tabular). Printed A.D. year(s): 967–977. Zambaur 1927, § 204 p. 212 (Baghdad): 1 April 967 CE (Julian; A.H. 17 Rabi' II 356); ended 29 May 978 CE (Julian; A.H. 18 Shawwal 367) Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
