note: "Reign as given: 1012/1013–1029/1030. Start 1012 CE to 1013 CE; end 1029 CE to 1030 CE. The Wikipedia row cites: Ross 1977 p. 579. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 137, § 56: A.H. 403 = 23 July 1012–11 July 1013 CE (Julian, tabular); ended A.H. 420 = 20 January 1029–9 January 1030 CE (Julian, tabular). Printed A.D. year(s): 1012–1029. Zambaur 1927, § 201 p. 210: A.H. 403 = 23 July 1012–11 July 1013 CE (Julian, tabular); ended A.H. 420 = 20 January 1029–9 January 1030 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
