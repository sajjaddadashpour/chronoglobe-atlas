confidence: scholarly-consensus
note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 1069 CE to 1070 CE; end 1078 CE to 1079 CE. Zambaur 1927, § 201 p. 210: A.H. 462 = 20 October 1069–8 October 1070 CE (Julian, tabular); ended A.H. 471 = 14 July 1078–2 July 1079 CE (Julian, tabular). Until 471; nos. 8-10 marked as Seljuk vassals. Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
