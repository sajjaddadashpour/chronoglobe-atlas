note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 1032 CE to 1033 CE; end 1034 CE to 1035 CE. Zambaur 1927, § 201 p. 210: A.H. 424 = 7 December 1032–25 November 1033 CE (Julian, tabular); ended A.H. 426 = 16 November 1034–5 November 1035 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
