note: "Reign as given from. Lane-Poole 1894 and/or. Zambaur 1927 (see source locators below). Start 1042 CE to 1043 CE; end 1049 CE to 1050 CE. Zambaur 1927, § 201 p. 210: A.H. 434 = 21 August 1042–10 August 1043 CE (Julian, tabular); ended A.H. 441 = 5 June 1049–24 May 1050 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept. Evidence: scholarly-or-primary."
