note: "Reign as given: 1049/1050–?. Start 1049 CE to 1050 CE; end unknown. End year unknown; latest is the polity end bound (1091 CE), not a reign date. End not given in the sources read. [Iran pass 2: that unknown bound has now been filled from Lane-Poole and/or Zambaur; earliest/latest are no longer the polity placeholder.] The Wikipedia row cites: Ross 1977 p. 579. Evidence: scholarly-or-primary. Zambaur 1927, § 201 p. 210: A.H. 441 = 5 June 1049–24 May 1050 CE (Julian, tabular); ended A.H. 462 = 20 October 1069–8 October 1070 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
