note: "Reign as given: 934/935–966/967. Start 934 CE to 935 CE; end 966 CE to 967 CE. The Wikipedia row cites: Ross 1977 p. 579. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 137, § 56: A.H. 323 = 11 December 934–29 November 935 CE (Julian, tabular); ended A.H. 356 = 17 December 966–5 December 967 CE (Julian, tabular). Printed A.D. year(s): 935–967. Zambaur 1927, § 201 p. 210: A.H. 323 = 11 December 934–29 November 935 CE (Julian, tabular); ended A.H. 356 = 17 December 966–5 December 967 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
