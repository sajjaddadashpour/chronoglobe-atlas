note: "Reign as given: 966/967–977/978. Start 966 CE to 967 CE; end 977 CE to 978 CE. Iranica 967-78. The Wikipedia row cites: Ross 1977 p. 579. Evidence: scholarly-or-primary. Lane-Poole 1894, p. 137, § 56: A.H. 356 = 17 December 966–5 December 967 CE (Julian, tabular); ended A.H. 366 = 30 August 976–19 August 977 CE (Julian, tabular). Printed A.D. year(s): 967–976. Zambaur 1927, § 201 p. 210: A.H. 356 = 17 December 966–5 December 967 CE (Julian, tabular); ended A.H. 366 = 30 August 976–19 August 977 CE (Julian, tabular). Consulted: yes, via Chief of Staff transcription of archive.org page images. Bosworth, The New Islamic Dynasties (1996) supersedes these editions. A.H. years were converted with the standard tabular (civil) Islamic calendar; when an A.H. year spans two Julian A.D. years both bounds are kept."
